name: fix-menu-clean
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix message envelope + agent init + load timing + diagnostics
        run: |
          python3 - <<'PY'
          import sys
          def rep(path,old,new):
              s=open(path,encoding='utf-8').read()
              if old in s:
                  open(path,'w',encoding='utf-8').write(s.replace(old,new,1)); print('patched',path)
              elif new in s:
                  print('already',path)
              else:
                  print('MISS',path,repr(old[:70])); sys.exit(1)

          # renderer diagnostics
          rep('native/renderer.cpp','#include "state.h"','#include "state.h"\n#include "diag.h"')
          rep('native/renderer.cpp','static void renderMain(){\n  ANativeWindow* win=g_win.load();',
              'static void renderMain(){\n  diag::log("renderMain start");\n  ANativeWindow* win=g_win.load();')
          rep('native/renderer.cpp','if(!n){ ANativeWindow_release(win); return; }',
              'if(!n){ diag::log("egl: no config"); ANativeWindow_release(win); return; }')
          rep('native/renderer.cpp','ImGui_ImplOpenGL3_Init("#version 300 es");',
              'ImGui_ImplOpenGL3_Init("#version 300 es");\n  diag::log("imgui gl init ok");')
          rep('native/renderer.cpp','  auto last=std::chrono::steady_clock::now();\n  while(g_run.load()){',
              '  auto last=std::chrono::steady_clock::now();\n  diag::log("render loop start");\n  while(g_run.load()){')
          rep('native/renderer.cpp','void tool_surface(void* win,int w,int h,float density){\n    if(g_run.load()) return;',
              'void tool_surface(void* win,int w,int h,float density){\n    diag::log("tool_surface %dx%d d=%.2f",w,h,density);\n    if(g_run.load()) return;')

          # diag publisher logging + API<29 fallback
          rep('native/diag.cpp','static void publishAll(){\n  if(!g_vm) return;',
              'static void publishAll(){\n  diag::log("publish start");\n  if(!g_vm) return;')
          rep('native/diag.cpp','if(!ctx){ g_vm->DetachCurrentThread(); return; }',
              'if(!ctx){ diag::log("publish: no context"); g_vm->DetachCurrentThread(); return; }\n  diag::log("publish: ctx ok");')
          rep('native/diag.cpp','int sdk=env->GetStaticIntField(bv,env->GetStaticFieldID(bv,"SDK_INT","I"));',
              'int sdk=env->GetStaticIntField(bv,env->GetStaticFieldID(bv,"SDK_INT","I"));\n  diag::log("publish sdk=%d",sdk);')
          rep('native/diag.cpp','if(env->ExceptionCheck()) env->ExceptionClear(); else ok=true;',
              'if(env->ExceptionCheck()){ diag::log("publish write exception"); env->ExceptionClear(); } else { ok=true; diag::log("published %s",name.c_str()); }')
          rep('native/diag.cpp','    if(resolver) env->DeleteLocalRef(resolver);',
              '''    if(sdk<29){
                std::vector<std::string> files;
                char pend[600]; snprintf(pend,sizeof pend,"%s/pending",g_dir);
                DIR* d=opendir(pend); if(d){ dirent* e; while((e=readdir(d))){ std::string nm=e->d_name; if(nm[0]=='.') continue; files.push_back(std::string(pend)+"/"+nm);} closedir(d); }
                files.push_back(std::string(g_dir)+"/diag.log");
                for(auto& p:files){ FILE* in=fopen(p.c_str(),"rb"); if(!in) continue;
                  std::string base=p.substr(p.find_last_of('/')+1);
                  std::string out="/sdcard/Download/libtool_"+base;
                  FILE* o=fopen(out.c_str(),"wb"); if(!o){ diag::log("fallback open fail %s",out.c_str()); fclose(in); continue; }
                  char b[8192]; size_t r; while((r=fread(b,1,sizeof b,in))>0) fwrite(b,1,r,o);
                  fclose(in); fclose(o); diag::log("fallback published %s",out.c_str()); }
              }
              if(resolver) env->DeleteLocalRef(resolver);''')

          # test manifest: WRITE_EXTERNAL_STORAGE for API<=28 fallback
          rep('testapp/AndroidManifest.xml','<uses-sdk android:minSdkVersion="26" android:targetSdkVersion="34"/>',
              '<uses-sdk android:minSdkVersion="26" android:targetSdkVersion="34"/>\n  <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>')
          print('PATCHES OK')
          PY

          cat > native/main.cpp <<'EOF_MAIN'
          #include "state.h"
          #include "diag.h"
          #include <frida-gumjs.h>
          #include <jni.h>
          #include <agent_js.h>
          #include <thread>
          static GumScript* g_script=nullptr; static GMainContext* g_ctx=nullptr;
          static void onMessage(const gchar* msg, GBytes* data, gpointer){
            json j; try{ j=json::parse(msg); }catch(...){ diag::log("bad json from agent: %s",msg?msg:"(null)"); return; }
            if(j.contains("type") && j["type"].is_string()){
              std::string ty=j["type"].get<std::string>();
              if(ty=="send" && j.contains("payload")) j=j["payload"];
              else if(ty=="error"){ diag::log("AGENT ERROR: %s",j.dump().c_str()); return; }
              else if(ty=="log"){ diag::log("agent log: %s",j.dump().c_str()); return; }
            }
            if(!j.is_object()){ diag::log("agent non-object: %s",j.dump().c_str()); return; }
            std::string t=j.value("t","");
            if(t.empty()){ diag::log("agent msg(no t): %s",j.dump().c_str()); return; }
            if(t=="diag"){ diag::log("agent: %s",j.value("msg","").c_str()); return; }
            if(data && t=="dex"){
              gsize n=0; gconstpointer p=g_bytes_get_data(data,&n);
              std::string path=diag::dir()+"/"+j.value("name","classes.dex");
              FILE* f=fopen(path.c_str(),"wb"); if(f){ fwrite(p,1,n,f); fclose(f); }
              diag::log("dex dumped %s",path.c_str());
              std::lock_guard<std::mutex> lk(G.mtx);
              G.dumped.push_back({path,(long long)n}); ui::toast("dumped "+path);
              return; }
            ui::route(j);
          }
          static gboolean doPost(gpointer p){ char* s=(char*)p; gum_script_post(g_script,s,nullptr); g_free(s); return G_SOURCE_REMOVE; }
          namespace bridge {
            void post(const json& j){ if(!g_script||!g_ctx) return; json m=j; m["type"]="cmd";
              g_main_context_invoke(g_ctx,doPost,g_strdup(m.dump().c_str())); }
          }
          static void gumThread(){
            diag::log("gum thread start");
            gum_init_embedded();
            g_ctx=g_main_context_new(); g_main_context_push_thread_default(g_ctx);
            GMainLoop* loop=g_main_loop_new(g_ctx,FALSE);
            GumScriptBackend* be=gum_script_backend_obtain_qjs();
            diag::log("qjs backend ok");
            GError* err=nullptr;
            std::string src((const char*)agent_js,agent_js_len);
            g_script=gum_script_backend_create_sync(be,"tool",src.c_str(),nullptr,nullptr,&err);
            if(err){ diag::log("script create ERROR: %s",err->message); return; }
            diag::log("script created");
            gum_script_set_message_handler(g_script,onMessage,nullptr,nullptr);
            gum_script_load_sync(g_script,nullptr);
            diag::log("script loaded");
            g_main_loop_run(loop);
          }
          extern "C" JNIEXPORT jint JNI_OnLoad(JavaVM* vm,void*){
            diag::init(vm); diag::log("JNI_OnLoad");
            std::thread(gumThread).detach();
            return JNI_VERSION_1_6;
          }
          void toolSetDir(const std::string& d){ diag::setDir(d); }
          EOF_MAIN

          cat > agent/index.js <<'EOF_IDX'
          const Java = require('frida-java-bridge');
          const core = require('./core');
          const overlay = require('./overlay');
          const features = require('./features');
          function diag(m){ try{ send({t:'diag', msg:m}); }catch(e){} }
          const origLog = console.log.bind(console);
          ['log','warn','error'].forEach(k=>{
            console[k]=(...a)=>{ const s=a.map(String).join(' '); diag('console.'+k+': '+s);
              try{ send({t:'log',ch:'script',text:s}); }catch(e){} origLog(...a); };
          });
          diag('agent top-level');
          let tries=0;
          function attempt(){
            try {
              Java.perform(()=>{
                try {
                  const app=Java.use('android.app.ActivityThread').currentApplication();
                  if(app===null){ if(tries++<40) diag('app null, retry '+tries); setTimeout(attempt,250); return; }
                  diag('app obtained');
                  const ctx=app.getApplicationContext();
                  const File=Java.use('java.io.File');
                  const dir=File.$new(ctx.getExternalFilesDir(null),'tool');
                  dir.mkdirs();
                  const Build=Java.use('android.os.Build$VERSION');
                  send({t:'paths', dir:dir.getAbsolutePath(), pkg:ctx.getPackageName(), sdk:Build.SDK_INT.value});
                  diag('paths sent');
                  core.init(ctx);
                  features.init(ctx,dir.getAbsolutePath());
                  diag('features init');
                  overlay.start(app);
                  diag('overlay start returned');
                  function loop(m){
                    try{ Java.performNow(()=>core.dispatch(m)); }
                    catch(e){ diag('dispatch error: '+e); send({t:'toast',msg:''+e}); }
                    recv('cmd',loop);
                  }
                  recv('cmd',loop);
                  diag('agent ready');
                  send({t:'ready'});
                } catch(e){ diag('init error: '+e+' | '+(e.stack||'')); setTimeout(attempt,500); }
              });
            } catch(e){ diag('perform error: '+e); setTimeout(attempt,500); }
          }
          attempt();
          EOF_IDX

          cat > agent/overlay.js <<'EOF_OVL'
          const Java = require('frida-java-bridge');
          function diag(m){ try{ send({t:'diag',msg:'overlay: '+m}); }catch(e){} }
          let nf=null, overlayView=null, proxy=null, lastText='', imeShown=false, currentDecor=null;
          function natives(){
            if(nf) return nf;
            const lib='libtool.so'; const get=n=>Module.getExportByName(lib,n);
            nf={
              surface:new NativeFunction(get('tool_surface'),'void',['pointer','int','int','float']),
              resize:new NativeFunction(get('tool_surface_resize'),'void',['int','int']),
              destroy:new NativeFunction(get('tool_surface_destroy'),'void',[]),
              touch:new NativeFunction(get('tool_touch'),'int',['int','float','float']),
              text:new NativeFunction(get('tool_text'),'void',['pointer']),
              special:new NativeFunction(get('tool_special'),'void',['int']),
              awFromSurface:new NativeFunction(Module.getExportByName('libandroid.so','ANativeWindow_fromSurface'),'pointer',['pointer','pointer'])
            };
            return nf;
          }
          function sendText(s){ const p=Memory.allocUtf8String(s); natives().text(p); }
          function showIME(v,on){
            if(on===imeShown) return; imeShown=on;
            try{
              const ctx=v.getContext();
              const imm=Java.cast(ctx.getSystemService('input_method'),Java.use('android.view.inputmethod.InputMethodManager'));
              if(on){ proxy.requestFocus(); imm.showSoftInput(proxy,0); }
              else { imm.hideSoftInputFromWindow(v.getWindowToken(),0); proxy.clearFocus(); }
            }catch(e){}
          }
          function attach(activity){
            try{
              Java.performNow(()=>{
                diag('attach begin');
                const N=natives();
                const decor=activity.getWindow().getDecorView();
                if(currentDecor===decor){ diag('same decor'); return; }
                if(overlayView&&currentDecor){ try{ Java.cast(currentDecor,Java.use('android.view.ViewGroup')).removeView(overlayView); }catch(e){} }
                currentDecor=decor;
                const SurfaceView=Java.use('android.view.SurfaceView');
                const view=SurfaceView.$new(activity);
                view.setZOrderOnTop(true);
                view.getHolder().setFormat(Java.use('android.graphics.PixelFormat').TRANSLUCENT.value);
                const density=activity.getResources().getDisplayMetrics().density.value;
                const env=Java.vm.getEnv().handle;
                const CB=Java.registerClass({
                  name:'re.tool.SurfCB'+Date.now(),
                  implements:[Java.use('android.view.SurfaceHolder$Callback')],
                  methods:{
                    surfaceCreated(h){ try{ diag('surfaceCreated');
                      const win=N.awFromSurface(env,h.getSurface().$h);
                      const r=h.getSurfaceFrame();
                      diag('win='+win+' '+r.width()+'x'+r.height());
                      N.surface(win,r.width(),r.height(),density);
                    }catch(e){ diag('surfaceCreated err '+e); } },
                    surfaceChanged(h,f,w,hh){ N.resize(w,hh); },
                    surfaceDestroyed(h){ diag('surfaceDestroyed'); N.destroy(); }
                  }
                });
                view.getHolder().addCallback(CB.$new());
                const Touch=Java.registerClass({
                  name:'re.tool.Touch'+Date.now(),
                  implements:[Java.use('android.view.View$OnTouchListener')],
                  methods:{
                    onTouch(v,e){ const a=e.getActionMasked(); const r=N.touch(a,e.getX(),e.getY());
                      if(a===0) showIME(v,(r&2)!==0); return (r&1)!==0; }
                  }
                });
                view.setOnTouchListener(Touch.$new());
                const EditText=Java.use('android.widget.EditText');
                proxy=EditText.$new(activity);
                proxy.setTextSize(1); proxy.setAlpha(0.0);
                const Watcher=Java.registerClass({
                  name:'re.tool.Watch'+Date.now(),
                  implements:[Java.use('android.text.TextWatcher')],
                  methods:{
                    beforeTextChanged(s,a,b,c){}, onTextChanged(s,a,b,c){},
                    afterTextChanged(editable){ try{
                      const s=''+editable.toString();
                      if(s.length>lastText.length&&s.startsWith(lastText)){
                        const add=s.substring(lastText.length);
                        for(const ch of add){ if(ch==='\n') N.special(2); else sendText(ch); }
                      } else if(s.length<lastText.length&&lastText.startsWith(s)){
                        for(let i=0;i<lastText.length-s.length;i++) N.special(1);
                      } else { sendText(s); }
                      lastText=s;
                    }catch(e){} }
                  }
                });
                proxy.addTextChangedListener(Watcher.$new());
                const LP=Java.use('android.widget.FrameLayout$LayoutParams');
                const vg=Java.cast(decor,Java.use('android.view.ViewGroup'));
                vg.addView(proxy,LP.$new(1,1));
                vg.addView(view,LP.$new(-1,-1));
                overlayView=view;
                diag('attach done');
              });
            }catch(e){ diag('attach err '+e); }
          }
          function start(app){
            try{
              diag('start');
              const CB=Java.registerClass({
                name:'re.tool.Lifecycle'+Date.now(),
                implements:[Java.use('android.app.Application$ActivityLifecycleCallbacks')],
                methods:{
                  onActivityCreated(a,b){}, onActivityStarted(a){},
                  onActivityResumed(a){ diag('resumed'); attach(a); },
                  onActivityPaused(a){}, onActivityStopped(a){},
                  onActivitySaveInstanceState(a,b){}, onActivityDestroyed(a){}
                }
              });
              app.registerActivityLifecycleCallbacks(CB.$new());
              diag('lifecycle registered');
              try{
                const at=Java.use('android.app.ActivityThread').currentActivityThread();
                const it=at.mActivities.value.values().iterator();
                while(it.hasNext()){
                  const rec=it.next(); const act=rec.activity.value;
                  if(act!==null&&!act.isFinishing()){ attach(act); break; }
                }
              }catch(e){ diag('current activity attach skip: '+e); }
            }catch(e){ diag('start err '+e); }
          }
          module.exports={start:start};
          EOF_OVL

          cat > testapp/src/com/example/tooltest/MainActivity.java <<'EOF_JAVA'
          package com.example.tooltest;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          public class MainActivity extends Activity implements View.OnClickListener {
              public static String secret = "hello-static";
              private int counter = 0;
              private EditText input;
              private TextView output;
              public String greet(String who, int times) { counter++; return "Hi " + who + " x" + times + " (#" + counter + ")"; }
              public int add(int a, int b) { return a + b; }
              public void logIt(String s) { android.util.Log.i("ToolTest", s); }
              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  System.loadLibrary("tool");
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.VERTICAL);
                  TextView t = new TextView(this);
                  t.setText("libtool test app - tap TOOL button");
                  input = new EditText(this); input.setHint("name");
                  Button btn = new Button(this); btn.setText("Call greet()");
                  output = new TextView(this);
                  btn.setOnClickListener(this);
                  l.addView(t); l.addView(input); l.addView(btn); l.addView(output);
                  setContentView(l);
              }
              @Override public void onClick(View v) {
                  output.setText(greet(input.getText().toString(), add(2, 3)));
                  logIt(output.getText().toString());
              }
          }
          EOF_JAVA

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "fix agent envelope/init, load timing, diagnostics; clean artifacts [skip ci]"; git push; }

      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: nttld/setup-ndk@v1
        id: ndk
        with: { ndk-version: r26d }

      - name: Build agent.js
        run: |
          npm install --no-fund --no-audit frida-compile@^16 frida-java-bridge@^6
          mkdir -p build/generated
          npx frida-compile agent/index.js -o build/agent.js
          (cd build && xxd -i agent.js > generated/agent_js.h)

      - name: Fetch devkits / imgui / json
        run: |
          mkdir -p deps
          V="${FRIDA_VERSION:-16.7.19}"
          for ABI in arm64 arm; do
            URL="https://github.com/frida/frida/releases/download/$V/frida-gumjs-devkit-$V-android-$ABI.tar.xz"
            if ! curl -fL -o devkit-$ABI.tar.xz "$URL"; then
              V=$(curl -fsSL "https://api.github.com/repos/frida/frida/releases?per_page=100" | jq -r '[.[].tag_name | select(startswith("16."))][0]')
              URL="https://github.com/frida/frida/releases/download/$V/frida-gumjs-devkit-$V-android-$ABI.tar.xz"
              curl -fL -o devkit-$ABI.tar.xz "$URL"
            fi
            mkdir -p deps/gum-$ABI; tar -xf devkit-$ABI.tar.xz -C deps/gum-$ABI
          done
          git clone --depth 1 --branch v1.90.9 https://github.com/ocornut/imgui deps/imgui
          mkdir -p deps/json/nlohmann
          curl -fL -o deps/json/nlohmann/json.hpp https://github.com/nlohmann/json/releases/download/v3.11.3/json.hpp

      - name: Build libtool.so
        run: |
          NDK="${{ steps.ndk.outputs.ndk-path }}"
          for PAIR in "arm64-v8a:arm64" "armeabi-v7a:arm"; do
            AABI="${PAIR%%:*}"; GABI="${PAIR##*:}"
            cmake -S . -B build/$AABI -Wno-deprecated \
              -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$AABI -DANDROID_PLATFORM=android-26 \
              -DCMAKE_BUILD_TYPE=Release \
              -DGUM_DIR=$GITHUB_WORKSPACE/deps/gum-$GABI \
              -DIMGUI_DIR=$GITHUB_WORKSPACE/deps/imgui \
              -DJSON_DIR=$GITHUB_WORKSPACE/deps/json \
              -DGEN_DIR=$GITHUB_WORKSPACE/build/generated
            cmake --build build/$AABI -j$(nproc)
          done
          mkdir -p out
          cp build/arm64-v8a/libtool.so out/libtool-arm64-v8a.so
          cp build/armeabi-v7a/libtool.so out/libtool-armeabi-v7a.so

      - name: Build test APK
        run: |
          set -e
          pick_bt(){ for v in 36.0.0 35.0.0 34.0.0; do [ -d "$ANDROID_HOME/build-tools/$v" ] && { echo "$ANDROID_HOME/build-tools/$v"; return; }; done; ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null | sort -V | tail -1; }
          pick_pj(){ for v in 34 35 36; do [ -f "$ANDROID_HOME/platforms/android-$v/android.jar" ] && { echo "$ANDROID_HOME/platforms/android-$v/android.jar"; return; }; done; ls -d "$ANDROID_HOME"/platforms/android-*/android.jar 2>/dev/null | sort -V | tail -1; }
          BT=$(pick_bt); PJ=$(pick_pj); BT="${BT%/}"; echo "BT=$BT PJ=$PJ"
          mkdir -p build/apk/obj build/apk/lib/arm64-v8a build/apk/lib/armeabi-v7a
          "$BT/aapt2" link --manifest testapp/AndroidManifest.xml -I "$PJ" \
            --min-sdk-version 26 --target-sdk-version 34 -o build/apk/base.apk
          javac -g -nowarn -source 8 -target 8 -bootclasspath "$PJ" -d build/apk/obj \
            testapp/src/com/example/tooltest/MainActivity.java
          "$BT/d8" --release --min-api 26 --lib "$PJ" --output build/apk $(find build/apk/obj -name '*.class')
          (cd build/apk && zip -j base.apk classes.dex)
          cp out/libtool-arm64-v8a.so build/apk/lib/arm64-v8a/libtool.so
          cp out/libtool-armeabi-v7a.so build/apk/lib/armeabi-v7a/libtool.so
          (cd build/apk && zip -r base.apk lib)
          "$BT/zipalign" -f 4 build/apk/base.apk build/apk/aligned.apk
          keytool -genkeypair -keystore build/debug.keystore -alias k -keyalg RSA \
            -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=tool"
          "$BT/apksigner" sign --ks build/debug.keystore --ks-pass pass:android \
            --key-pass pass:android --out out/tooltest.apk build/apk/aligned.apk

      - name: Upload clean artifact (3 files only)
        uses: actions/upload-artifact@v4
        with:
          name: libtool-clean
          path: |
            out/tooltest.apk
            out/libtool-arm64-v8a.so
            out/libtool-armeabi-v7a.so
          if-no-files-found: error
