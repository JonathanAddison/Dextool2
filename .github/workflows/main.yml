          static void tabClasses(){
            ImGui::BeginTabBar("##cw");
            if(ImGui::TabItemButton("+")){ ClassWindow w; w.id=G.nextWin++; G.wins.push_back(w); G.activeWin=w.id; }
            for(auto& w:G.wins){
              if(!w.open) continue;
              std::string lab=w.title+"###w"+std::to_string(w.id);
              if(ImGui::BeginTabItem(lab.c_str())){
                G.activeWin=w.id;
                if(w.isList) listWindow(w); else classWindow(w);
                ImGui::EndTabItem();
              }
            }
            ImGui::EndTabBar();
            G.wins.erase(std::remove_if(G.wins.begin(),G.wins.end(),[](const ClassWindow& w){return !w.open;}),G.wins.end());
            if(G.wins.empty()){ ClassWindow w; w.id=G.nextWin++; G.wins.push_back(w); }
          }
          // ---------------- frame ----------------
          void draw(){
            std::lock_guard<std::mutex> lk(G.mtx);
            ImGuiIO& io=ImGui::GetIO();
            io.FontGlobalScale=G.cfg.fontScale;
            ImGui::SetNextWindowPos(ImVec2(8,140),ImGuiCond_FirstUseEver);
            ImGui::PushStyleVar(ImGuiStyleVar_WindowPadding,ImVec2(6,6));
            ImGui::Begin("##toggle",nullptr,ImGuiWindowFlags_NoDecoration|ImGuiWindowFlags_AlwaysAutoResize|ImGuiWindowFlags_NoNav);
            if(ImGui::Button(G.menuOpen?"X":"TOOL")) G.menuOpen=!G.menuOpen;
            ImGui::End(); ImGui::PopStyleVar();
            if(G.menuOpen){
              ImGui::SetNextWindowSize(ImVec2(std::min(520.0f,io.DisplaySize.x-16),std::min(700.0f,io.DisplaySize.y-60)),ImGuiCond_FirstUseEver);
              ImGui::SetNextWindowPos(ImVec2(8,180),ImGuiCond_FirstUseEver);
              ImGui::SetNextWindowBgAlpha(G.cfg.opacity);
              ImGui::Begin("libtool",&G.menuOpen);
              if(ImGui::BeginTabBar("##main")){
                if(ImGui::BeginTabItem("Settings")){ tabSettings(); ImGui::EndTabItem(); }
                if(ImGui::BeginTabItem("Patches")){ tabPatches(); ImGui::EndTabItem(); }
                if(ImGui::BeginTabItem("Hooks")){ tabHooks(); ImGui::EndTabItem(); }
                if(ImGui::BeginTabItem("Trackers")){ tabTrackers(); ImGui::EndTabItem(); }
                if(ImGui::BeginTabItem("Dumper")){ tabDumper(); ImGui::EndTabItem(); }
                if(ImGui::BeginTabItem("Recorder")){ tabRecorder(); ImGui::EndTabItem(); }
                if(ImGui::BeginTabItem("Monitor")){ tabMonitor(); ImGui::EndTabItem(); }
                if(ImGui::BeginTabItem("Script")){ tabScript(); ImGui::EndTabItem(); }
                if(ImGui::BeginTabItem("Classes")){ tabClasses(); ImGui::EndTabItem(); }
                ImGui::EndTabBar();
              }
              ImGui::End();
            }
            float y=io.DisplaySize.y-30;
            for(auto it=G.toasts.begin();it!=G.toasts.end();){
              it->second-=io.DeltaTime;
              if(it->second<=0){ it=G.toasts.erase(it); continue; }
              ImGui::SetNextWindowPos(ImVec2(8,y-28)); y-=32;
              ImGui::Begin(("##toast"+std::to_string((size_t)&*it)).c_str(),nullptr,
                ImGuiWindowFlags_NoDecoration|ImGuiWindowFlags_AlwaysAutoResize|ImGuiWindowFlags_NoInputs|ImGuiWindowFlags_NoNav);
              ImGui::TextUnformatted(it->first.c_str()); ImGui::End(); ++it;
            }
          }
          } // namespace ui
          EOF_UI

      # ============================================================
      # 2) AGENT (frida-java-bridge bundled by frida-compile)
      # ============================================================
      - name: Generate agent
        run: |
          [ -f agent/index.js ] && exit 0
          mkdir -p agent
          cat > agent/index.js <<'EOF_IDX'
          const Java = require('frida-java-bridge');
          const core = require('./core');
          const overlay = require('./overlay');
          const features = require('./features');

          const origLog = console.log.bind(console);
          ['log','warn','error'].forEach(k => {
            console[k] = (...a) => { try { send({t:'log', ch:'script', text:a.map(String).join(' ')}); } catch(e){} origLog(...a); };
          });

          Java.perform(() => {
            const app = Java.use('android.app.ActivityThread').currentApplication();
            const ctx = app.getApplicationContext();
            const File = Java.use('java.io.File');
            const dir = File.$new(ctx.getExternalFilesDir(null), 'tool');
            dir.mkdirs();
            const Build = Java.use('android.os.Build$VERSION');
            send({t:'paths', dir:dir.getAbsolutePath(), pkg:ctx.getPackageName(), sdk:Build.SDK_INT.value});
            core.init(ctx);
            features.init(ctx, dir.getAbsolutePath());
            overlay.start(app);
            function loop(m){
              try { Java.performNow(() => core.dispatch(m)); }
              catch(e){ send({t:'toast', msg:''+e}); }
              recv('cmd', loop);
            }
            recv('cmd', loop);
            send({t:'ready'});
          });
          EOF_IDX
          cat > agent/core.js <<'EOF_CORE'
          const Java = require('frida-java-bridge');
          const handles = new Map(); let nextH = 1;
          const state = new Map();   // key cls::name#ov -> {klass,name,ov,ret,types,patch,hook,track,record,trackId,installed}
          const fieldState = new Map(); // key cls::field -> {lockTimer,watchTimer,last,patch}
          let appCtx = null;

          function retain(o){ const h=nextH++; handles.set(h, Java.retain(o)); return h; }
          function safeStr(o){ try { return ''+o; } catch(e){ return '<obj>'; } }
          function key(c,n,ov){ return c+'::'+n+'#'+ov; }
          function isPrim(t){ return ['int','long','short','byte','float','double','boolean','char'].indexOf(t)>=0; }
          function coerce(t,v){
            if(t==='boolean') return v===true||v==='true';
            if(t==='char') return (''+v).charCodeAt(0)||0;
            if(t==='long'||t==='int'||t==='short'||t==='byte') return parseInt(v)||0;
            if(t==='float'||t==='double') return parseFloat(v)||0;
            return v;
          }
          function dec(enc,t,orig){
            if(!enc) return orig;
            switch(enc.k){
              case 'skip': return orig;
              case 'null': return null;
              case 'str': return ''+enc.v;
              case 'prim': return coerce(t,enc.v);
              case 'obj': { const o=handles.get(enc.h); return o===undefined?null:o; }
              default: return orig;
            }
          }
          function defRet(t){
            if(t==='void') return undefined;
            if(t==='boolean') return false;
            if(isPrim(t)) return 0;
            return null;
          }
          function stack(){
            try {
              const T = Java.use('java.lang.Thread');
              const st = T.currentThread().getStackTrace();
              const out=[];
              for(let i=3;i<st.length&&out.length<8;i++){
                const f=st[i]; const c=f.getClassName();
                if(c.startsWith('re.tool.')||c.startsWith('java.lang.Thread')) continue;
                out.push({c:c, s:''+f});
              }
              return out;
            } catch(e){ return []; }
          }
          function logCall(st,args,ret,phase){
            const ch = st.track ? 'track' : 'record';
            const id = st.track ? st.trackId : key(st.cls,st.name,st.ov);
            const a = args.map(safeStr).join(', ');
            const text = phase==='exit'
              ? st.cls+'.'+st.name+'('+a+') -> '+safeStr(ret)
              : st.cls+'.'+st.name+'('+a+')';
            send({t:'log', ch:ch, id:id, cls:st.cls, name:st.name, text:text, stack:stack()});
          }
          function ensure(st){
            if(st.installed) return;
            const ovf = st.klass[st.name].overloads[st.ov];
            ovf.implementation = function(...args){
              let a = args;
              if(st.patch && st.patch.enabled && !st.patch.isField)
                a = args.map((v,i)=>dec(st.patch.args[i], st.types[i], v));
              const tracing = (st.track&&st.trackOn)||st.record;
              if(tracing) logCall(st,a,null,'enter');
              let r;
              if(st.hook && st.hook.enabled){
                if(st.hook.mode==='noop') r = defRet(st.ret);
                else if(st.hook.fn) r = st.hook.fn.call(this,a,()=>ovf.apply(this,a));
                else r = ovf.apply(this,a);
              } else r = ovf.apply(this,a);
              if(st.patch && st.patch.enabled && !st.patch.isField && st.patch.ret && st.patch.ret.k!=='skip')
                r = dec(st.patch.ret, st.ret, r);
              if(tracing) logCall(st,a,r,'exit');
              return r;
            };
            st.installed = true;
          }
          function maybeRemove(st){
            if(st.patch||st.hook||(st.track&&st.trackOn)||st.record) return;
            try { st.klass[st.name].overloads[st.ov].implementation = null; } catch(e){}
            state.delete(st.key);
          }
          function getSt(cls,name,ov){
            const k = key(cls,name,ov);
            let st = state.get(k);
            if(!st){
              const klass = Java.use(cls);
              const ovf = klass[name].overloads[ov];
              st = { key:k, cls:cls, name:name, ov:ov, klass:klass,
                     ret:ovf.returnType.className, types:ovf.argumentTypes.map(t=>t.className),
                     installed:false };
              state.set(k,st);
            }
            return st;
          }
          function setField(cls,name,h,type,val){
            const klass = Java.use(cls);
            const v = isPrim(type)?coerce(type,val):(type==='java.lang.String'?''+val:val);
            if(h){ Java.cast(handles.get(h),klass)[name].value = v; }
            else klass[name].value = v;
          }
          function readField(cls,name,h){
            const klass = Java.use(cls);
            const o = h?Java.cast(handles.get(h),klass):klass;
            return safeStr(o[name].value);
          }
          function classInfo(cls,h){
            const klass = Java.use(cls);
            const Modifier = Java.use('java.lang.reflect.Modifier');
            const methods=[], fields=[], ctors=[];
            const ms = klass.class.getDeclaredMethods();
            for(let i=0;i<ms.length;i++){
              const m=ms[i]; const n=m.getName();
              const ps=m.getParameterTypes(); const p=[];
              for(let j=0;j<ps.length;j++) p.push(ps[j].getName());
              const mods=m.getModifiers();
              let ov=-1;
              try {
                const ovs=klass[n].overloads;
                for(let o=0;o<ovs.length;o++){
                  const at=ovs[o].argumentTypes.map(t=>t.className);
                  if(at.length===p.length&&at.every((t,x)=>t===p[x])){ ov=o; break; }
                }
              } catch(e){}
              methods.push({n:n, mods:Modifier.toString(mods), ret:m.getReturnType().getName(),
                            p:p, st:Modifier.isStatic(mods), ov:ov});
            }
            const fs = klass.class.getDeclaredFields();
            const inst = h?Java.cast(handles.get(h),klass):null;
            for(let i=0;i<fs.length;i++){
              const f=fs[i]; const mods=f.getModifiers(); const st=Modifier.isStatic(mods);
              let v='';
              try { v = st?safeStr(klass[f.getName()].value):(inst?safeStr(inst[f.getName()].value):''); } catch(e){}
              fields.push({n:f.getName(), mods:Modifier.toString(mods), t:f.getType().getName(), st:st, v:v});
            }
            const cs = klass.class.getDeclaredConstructors();
            for(let i=0;i<cs.length;i++){
              const ps=cs[i].getParameterTypes(); const p=[];
              for(let j=0;j<ps.length;j++) p.push(ps[j].getName());
              ctors.push(p);
            }
            return {methods:methods, fields:fields, ctors:ctors};
          }
          function enumerate(filter,mode,sub){
            const f=(filter||'').toLowerCase();
            const names = Java.enumerateLoadedClassesSync();
            const out=[];
            if(mode===0){
              for(const n of names){ if(out.length>=500) break;
                if(!f||n.toLowerCase().indexOf(f)>=0) out.push(n); }
              return out;
            }
            let scanned=0;
            for(const n of names){
              if(out.length>=300||scanned>=20000) break;
              if(n.startsWith('[')||n.startsWith('re.tool.')) continue;
              scanned++;
              try {
                const k=Java.use(n);
                if(mode===1){
                  const ms=k.class.getDeclaredMethods();
                  for(let i=0;i<ms.length;i++){
                    const m=ms[i]; let hit=false;
                    if(sub===0) hit=m.getName().toLowerCase().indexOf(f)>=0;
                    else if(sub===1) hit=m.getReturnType().getName().toLowerCase().indexOf(f)>=0;
                    else { const ps=m.getParameterTypes();
                      for(let j=0;j<ps.length;j++) if(ps[j].getName().toLowerCase().indexOf(f)>=0) hit=true; }
                    if(hit&&f){ out.push(n); break; }
                  }
                } else {
                  const fs=k.class.getDeclaredFields();
                  for(let i=0;i<fs.length;i++){
                    const fl=fs[i];
                    const s=(sub===0?fl.getName():fl.getType().getName()).toLowerCase();
                    if(f&&s.indexOf(f)>=0){ out.push(n); break; }
                  }
                }
              } catch(e){}
            }
            return out;
          }
          function doCreate(m){
            const klass=Java.use(m.cls);
            const sel=m.sel;
            let args=[];
            let ctor;
            const news=klass.$new;
            if(sel>=0&&news.overloads&&news.overloads[sel]){
              ctor=news.overloads[sel];
              args=m.args.map((e,i)=>dec(e,ctor.argumentTypes[i].className,null));
            } else {
              // default-args create: pick ctor with fewest params
              let best=null,bn=1e9;
              if(news.overloads) for(const o of news.overloads)
                if(o.argumentTypes.length<bn){ bn=o.argumentTypes.length; best=o; }
              ctor=best;
              if(ctor) args=ctor.argumentTypes.map(t=>{
                const c=t.className;
                if(c==='boolean') return false;
                if(isPrim(c)) return 0;
                if(c==='java.lang.String') return '';
                return null;
              });
            }
            const obj = ctor?ctor.apply(klass,args):klass.$new();
            const h=retain(obj);
            send({t:'created', ctx:m.ctx, h:h, label:safeStr(obj), cls:m.cls});
          }
          function dispatch(m){
            const t=m.t;
            if(t==='enum'){ send({t:'classes', ctx:m.ctx, items:enumerate(m.filter,m.mode,m.sub)}); }
            else if(t==='info'){ const i=classInfo(m.cls,m.h); i.t='info'; i.ctx=m.ctx; i.cls=m.cls; send(i); }
            else if(t==='call'){
              try {
                const klass=Java.use(m.cls);
                const ovf=klass[m.name].overloads[m.ov];
                const recv=m.h?Java.cast(handles.get(m.h),klass):klass;
                const args=m.args.map((e,i)=>dec(e,ovf.argumentTypes[i].className,null));
                const r=ovf.apply(recv,args);
                send({t:'callResult', ctx:m.ctx, ok:true, text:safeStr(r), cls:m.cls});
              } catch(e){ send({t:'callResult', ctx:m.ctx, ok:false, text:''+e, cls:m.cls}); }
            }
            else if(t==='patch'){
              const r=m.rec;
              if(r.isField){
                const fk=r.cls+'::'+r.member;
                let fs=fieldState.get(fk)||{};
                if(fs.lockTimer){ clearInterval(fs.lockTimer); fs.lockTimer=null; }
                if(r.enabled){
                  setField(r.cls,r.member,0,r.type,r.ret.v);
                  if(r.lock) fs.lockTimer=setInterval(()=>{ try{ setField(r.cls,r.member,0,r.type,r.ret.v);}catch(e){} },1000);
                }
                fs.patch=r; fieldState.set(fk,fs);
              } else {
                const st=getSt(r.cls,r.member,r.ov);
                st.patch=r.enabled?r:null; ensure(st);
              }
              send({t:'toast', msg:'patch '+(r.enabled?'applied':'disabled')});
            }
            else if(t==='patchDel'){
              const p=m.id;
              for(const [k,st] of state) if(st.patch&&st.patch.id===p){ st.patch=null; maybeRemove(st); }
              const fs=fieldState.get(p); if(fs&&fs.lockTimer) clearInterval(fs.lockTimer);
              fieldState.delete(p);
            }
            else if(t==='hook'){
              const r=m.rec;
              if(r.mode==='smali'){ send({t:'toast', msg:'smali mode ships in phase 2'}); return; }
              const st=getSt(r.cls,r.name,r.ov);
              if(r.mode==='java'){
                try { r.fn=new Function('a','orig',r.code); }
                catch(e){ send({t:'toast', msg:'hook compile error: '+e}); return; }
              }
              st.hook=r.enabled?r:null; ensure(st);
              send({t:'toast', msg:'hook '+(r.enabled?'applied':'disabled')});
            }
            else if(t==='hookDel'){
              for(const [k,st] of state) if(st.hook&&st.hook.id===m.id){ st.hook=null; maybeRemove(st); }
            }
            else if(t==='track'){
              if(m.isField){
                const fk=m.cls+'::'+m.member;
                let fs=fieldState.get(fk)||{};
                if(fs.watchTimer){ clearInterval(fs.watchTimer); fs.watchTimer=null; }
                if(m.on){
                  fs.last=readField(m.cls,m.member,0);
                  fs.watchTimer=setInterval(()=>{
                    try { const v=readField(m.cls,m.member,0);
                      if(v!==fs.last){ send({t:'log', ch:'track', id:m.id, cls:m.cls, name:m.member,
                        text:m.cls+'.'+m.member+': '+fs.last+' -> '+v, stack:[]}); fs.last=v; } } catch(e){}
                  },1000);
                }
                fieldState.set(fk,fs);
              } else {
                const st=getSt(m.cls,m.member,m.ov);
                st.track=m.on; st.trackOn=m.on; st.trackId=m.id;
                if(m.on) ensure(st); else maybeRemove(st);
              }
            }
            else if(t==='trackDel'){
              for(const [k,st] of state) if(st.trackId===m.id){ st.track=false; st.trackOn=false; maybeRemove(st); }
              const fs=fieldState.get(m.cls+'::'+m.member);
              if(fs&&fs.watchTimer){ clearInterval(fs.watchTimer); fs.watchTimer=null; }
            }
            else if(t==='inst'){
              const items=[];
              Java.choose(m.cls,{
                onMatch(o){ if(items.length<200) items.push({h:retain(o), s:safeStr(o)}); },
                onComplete(){ send({t:'inst', ctx:m.ctx, items:items}); }
              });
            }
            else if(t==='create'){ doCreate(m); }
            else if(t==='fieldSet'){ try{ setField(m.cls,m.name,m.h,m.type,m.val); send({t:'toast',msg:'field set'});}catch(e){send({t:'toast',msg:''+e});} }
            else if(t==='fieldGet'){ try{ send({t:'fieldVal', ctx:m.ctx, val:readField(m.cls,m.name,m.h)});}catch(e){send({t:'fieldVal',ctx:m.ctx,val:''+e});} }
            else if(t==='eval'){ try{ const r=(0,eval)(m.code); if(r!==undefined) console.log(''+r);}catch(e){console.log('ERROR '+e);} }
            else if(t==='dump'){ require('./features').dumpDex(); }
            else if(t==='record'){ require('./features').record(m.on,m.scope,state,getSt,ensure,maybeRemove); }
            else if(t==='monitor'){ require('./features').monitor(m.on); }
            else if(t==='settings'){ require('./features').setPublish(m.publish); }
          }
          module.exports = { init(ctx){ appCtx=ctx; }, dispatch:dispatch, handles:handles, getSt:getSt, ensure:ensure, maybeRemove:maybeRemove };
          EOF_CORE
          cat > agent/overlay.js <<'EOF_OVL'
          const Java = require('frida-java-bridge');
          let nf=null, overlayView=null, proxy=null, lastText='', imeShown=false, currentDecor=null;
          function natives(){
            if(nf) return nf;
            const lib='libtool.so';
            const get=n=>Module.getExportByName(lib,n);
            nf={
              surface:new NativeFunction(get('tool_surface'),'void',['pointer','int','int','float']),
              resize:new NativeFunction(get('tool_surface_resize'),'void',['int','int']),
              destroy:new NativeFunction(get('tool_surface_destroy'),'void',[]),
              touch:new NativeFunction(get('tool_touch'),'int',['int','float','float']),
              text:new NativeFunction(get('tool_text'),'void',['pointer']),
              special:new NativeFunction(get('tool_special'),'void',['int']),
              awFromSurface:new NativeFunction(Module.getExportByName('libandroid.so','ANativeWindow_fromSurface'),'pointer',['pointer','pointer'])
            };
            return nf;
          }
          function sendText(s){ const p=Memory.allocUtf8String(s); natives().text(p); }
          function showIME(v,on){
            if(on===imeShown) return; imeShown=on;
            try {
              const ctx=v.getContext();
              const imm=Java.cast(ctx.getSystemService('input_method'),Java.use('android.view.inputmethod.InputMethodManager'));
              if(on){ proxy.requestFocus(); imm.showSoftInput(proxy,0); }
              else { imm.hideSoftInputFromWindow(v.getWindowToken(),0); proxy.clearFocus(); }
            } catch(e){}
          }
          function attach(activity){
            Java.performNow(()=>{
              const N=natives();
              const decor=activity.getWindow().getDecorView();
              if(currentDecor===decor) return;
              if(overlayView&&currentDecor){ try{ Java.cast(currentDecor,Java.use('android.view.ViewGroup')).removeView(overlayView); }catch(e){} }
              currentDecor=decor;
              const SurfaceView=Java.use('android.view.SurfaceView');
              const view=SurfaceView.$new(activity);
              view.setZOrderOnTop(true);
              view.getHolder().setFormat(Java.use('android.graphics.PixelFormat').TRANSLUCENT.value);
              const density=activity.getResources().getDisplayMetrics().density.value;
              const env=Java.vm.getEnv().handle;
              const CB=Java.registerClass({
                name:'re.tool.SurfCB'+Date.now(),
                implements:[Java.use('android.view.SurfaceHolder$Callback')],
                methods:{
                  surfaceCreated(h){
                    const win=N.awFromSurface(env,h.getSurface().$h);
                    const r=h.getSurfaceFrame();
                    N.surface(win,r.width(),r.height(),density);
                  },
                  surfaceChanged(h,f,w,hh){ N.resize(w,hh); },
                  surfaceDestroyed(h){ N.destroy(); }
                }
              });
              view.getHolder().addCallback(CB.$new());
              const Touch=Java.registerClass({
                name:'re.tool.Touch'+Date.now(),
                implements:[Java.use('android.view.View$OnTouchListener')],
                methods:{
                  onTouch(v,e){
                    const a=e.getActionMasked();
                    const r=N.touch(a,e.getX(),e.getY());
                    if(a===0) showIME(v,(r&2)!==0);
                    return (r&1)!==0;
                  }
                }
              });
              view.setOnTouchListener(Touch.$new());
              // hidden EditText as IME proxy -> forwards typed text to ImGui
              const EditText=Java.use('android.widget.EditText');
              proxy=EditText.$new(activity);
              proxy.setTextSize(1); proxy.setAlpha(0.0);
              const Watcher=Java.registerClass({
                name:'re.tool.Watch'+Date.now(),
                implements:[Java.use('android.text.TextWatcher')],
                methods:{
                  beforeTextChanged(s,a,b,c){},
                  onTextChanged(s,a,b,c){},
                  afterTextChanged(editable){
                    const s=''+editable.toString();
                    if(s.length>lastText.length&&s.startsWith(lastText)){
                      const add=s.substring(lastText.length);
                      for(const ch of add){ if(ch==='\n') N.special(2); else sendText(ch); }
                    } else if(s.length<lastText.length&&lastText.startsWith(s)){
                      for(let i=0;i<lastText.length-s.length;i++) N.special(1);
                    } else { sendText(s); }
                    lastText=s;
                  }
                }
              });
              proxy.addTextChangedListener(Watcher.$new());
              const LP=Java.use('android.widget.FrameLayout$LayoutParams');
              const vg=Java.cast(decor,Java.use('android.view.ViewGroup'));
              vg.addView(proxy,LP.$new(1,1));
              vg.addView(view,LP.$new(-1,-1));
              overlayView=view;
            });
          }
          function start(app){
            const CB=Java.registerClass({
              name:'re.tool.Lifecycle'+Date.now(),
              implements:[Java.use('android.app.Application$ActivityLifecycleCallbacks')],
              methods:{
                onActivityCreated(a,b){}, onActivityStarted(a){},
                onActivityResumed(a){ attach(a); },
                onActivityPaused(a){}, onActivityStopped(a){},
                onActivitySaveInstanceState(a,b){},
                onActivityDestroyed(a){}
              }
            });
            app.registerActivityLifecycleCallbacks(CB.$new());
          }
          module.exports={start:start};
          EOF_OVL
          cat > agent/features.js <<'EOF_FEAT'
          const Java = require('frida-java-bridge');
          let ctxRef=null, dirPath='', publish=true;
          let sslHooks=[], urlHook=null, recording=[], monitorOn=false;

          function writeFile(name,bytes){
            const File=Java.use('java.io.File');
            const f=File.$new(dirPath,name);
            const fos=Java.use('java.io.FileOutputStream').$new(f);
            fos.write(bytes); fos.close();
            return f.getAbsolutePath();
          }
          function publishToDownloads(name,path){
            if(!publish) return;
            try {
              const Build=Java.use('android.os.Build$VERSION');
              if(Build.SDK_INT.value>=29){
                const CV=Java.use('android.content.ContentValues');
                const cv=CV.$new();
                cv.put('_display_name',name);
                cv.put('mime_type','application/octet-stream');
                const MS=Java.use('android.provider.MediaStore$Downloads');
                const resolver=ctxRef.getContentResolver();
                const uri=resolver.insert(MS.EXTERNAL_CONTENT_URI.value,cv);
                if(uri!==null){
                  const os=resolver.openOutputStream(uri);
                  const fis=Java.use('java.io.FileInputStream').$new(path);
                  const buf=Java.array('byte',new Array(8192).fill(0));
                  let n; while((n=fis.read(buf))>0) os.write(buf,0,n);
                  os.close(); fis.close();
                }
              }
            } catch(e){}
          }
          function installJavaCrash(){
            const prev=Java.use('java.lang.Thread').getDefaultUncaughtExceptionHandler();
            const H=Java.registerClass({
              name:'re.tool.Crash'+Date.now(),
              implements:[Java.use('java.lang.Thread$UncaughtExceptionHandler')],
              methods:{
                uncaughtException(t,e){
                  try {
                    const Log=Java.use('android.util.Log');
                    const s=Log.getStackTraceString(e);
                    const p=writeFile('jcrash_'+Date.now()+'.txt',Java.array('byte',Array.from(s).map(c=>c.charCodeAt(0))));
                    publishToDownloads(p.split('/').pop(),p);
                  } catch(x){}
                  if(prev!==null) prev.uncaughtException(t,e);
                }
              }
            });
            Java.use('java.lang.Thread').setDefaultUncaughtExceptionHandler(H.$new());
          }
          function dumpDex(){
            const seen=new Set(); let count=0;
            const ranges=Process.enumerateRanges('r--');
            for(const r of ranges){
              if(r.size>128*1024*1024) continue;
              let hits=[];
              try { hits=Memory.scanSync(r.base,r.size,'64 65 78 0a 30 33'); } catch(e){ continue; }
              for(const h of hits){
                const base=h.address;
                if(seen.has(base.toString())) continue;
                seen.add(base.toString());
                try {
                  const size=base.add(32).readU32();
                  if(size<112||size>r.size) continue;
                  const bytes=base.readByteArray(size);
                  send({t:'dex', name:'classes_'+base+'.dex', size:size}, bytes);
                  count++;
                } catch(e){}
              }
            }
            send({t:'toast', msg:'dumped '+count+' dex image(s)'});
          }
          function record(on,scope,state,getSt,ensure,maybeRemove){
            if(on){
              const names=Java.enumerateLoadedClassesSync().filter(n=>n.startsWith(scope)&&!n.startsWith('['));
              let classes=0,methods=0;
              for(const n of names){
                if(classes>=300||methods>=3000) break;
                try {
                  const k=Java.use(n);
                  const ms=k.class.getDeclaredMethods();
                  const done=new Set();
                  for(let i=0;i<ms.length;i++){
                    const name=ms[i].getName();
                    if(done.has(name)) continue; done.add(name);
                    let ovs; try{ ovs=k[name].overloads; }catch(e){ continue; }
                    for(let o=0;o<ovs.length;o++){
                      if(methods>=3000) break;
                      const st=getSt(n,name,o);
                      if(!st.record){ st.record=true; ensure(st); recording.push(st); methods++; }
                    }
                  }
                  classes++;
                } catch(e){}
              }
              send({t:'toast', msg:'recording '+methods+' methods / '+classes+' classes (capped)'});
            } else {
              for(const st of recording){ st.record=false; maybeRemove(st); }
              recording=[];
              send({t:'toast', msg:'recorder stopped'});
            }
          }
          function javaStack(){
            try {
              if(Java.vm.tryGetEnv()===null) return [];
              let out=[];
              Java.performNow(()=>{
                const st=Java.use('java.lang.Thread').currentThread().getStackTrace();
                for(let i=3;i<st.length&&out.length<8;i++){
                  const f=st[i]; out.push({c:f.getClassName(), s:''+f});
                }
              });
              return out;
            } catch(e){ return []; }
          }
          function preview(buf,len){
            const n=Math.min(len,512);
            const bytes=new Uint8Array(buf.readByteArray(n));
            let s='';
            for(const b of bytes) s+=(b>=32&&b<127)?String.fromCharCode(b):'.';
            return s;
          }
          function monitor(on){
            monitorOn=on;
            if(on){
              const ssl=Process.findModuleByName('libssl.so');
              if(ssl){
                const getfd=new NativeFunction(ssl.getExportByName('SSL_get_fd'),'int',['pointer']);
                const w=ssl.findExportByName('SSL_write');
                const r=ssl.findExportByName('SSL_read');
                if(w) sslHooks.push(Interceptor.attach(w,{
                  onEnter(a){
                    if(!monitorOn) return;
                    const len=a[2].toInt32();
                    send({t:'log', ch:'monitor', cls:'', name:'SSL_write',
                      text:'-> fd'+getfd(a[0])+' '+len+'B',
                      preview:preview(a[1],len), stack:javaStack()});
                  }
                }));
                if(r) sslHooks.push(Interceptor.attach(r,{
                  onEnter(a){ this.ssl=a[0]; this.buf=a[1]; },
                  onLeave(ret){
                    if(!monitorOn) return;
                    const n=ret.toInt32(); if(n<=0) return;
                    send({t:'log', ch:'monitor', cls:'', name:'SSL_read',
                      text:'<- fd'+getfd(this.ssl)+' '+n+'B',
                      preview:preview(this.buf,n), stack:javaStack()});
                  }
                }));
              }
              try {
                const URL=Java.use('java.net.URL');
                urlHook=URL.openConnection.overload().implementation=function(){
                  if(monitorOn) send({t:'log', ch:'monitor', cls:'java.net.URL', name:'openConnection',
                    text:'URL '+this.toString(), preview:this.toString(), stack:javaStack()});
                  return this.openConnection();
                };
              } catch(e){}
              send({t:'toast', msg:'monitor started (TLS plaintext + URL)'});
            } else {
              for(const h of sslHooks) Interceptor.detach(h);
              sslHooks=[];
              if(urlHook){ try{ Java.use('java.net.URL').openConnection.overload().implementation=null; }catch(e){} urlHook=null; }
              send({t:'toast', msg:'monitor stopped'});
            }
          }
          function init(ctx,dir){
            ctxRef=ctx; dirPath=dir;
            installJavaCrash();
          }
          module.exports={init:init, dumpDex:dumpDex, record:record, monitor:monitor,
                          setPublish(p){ publish=p; }};
          EOF_FEAT

      # ============================================================
      # 3) TEST APP + INJECTOR + README
      # ============================================================
      - name: Generate test app and tools
        run: |
          [ -f testapp/AndroidManifest.xml ] && exit 0
          mkdir -p testapp/src/com/example/tooltest tools
          cat > testapp/AndroidManifest.xml <<'EOF_MAN'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.tooltest">
            <uses-sdk android:minSdkVersion="26" android:targetSdkVersion="34"/>
            <application android:label="ToolTest" android:theme="@android:style/Theme.Material.Light">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF_MAN
          cat > testapp/src/com/example/tooltest/MainActivity.java <<'EOF_JAVA'
          package com.example.tooltest;
          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.*;
          public class MainActivity extends Activity {
            public static String secret = "hello-static";
            private int counter = 0;
            static { System.loadLibrary("tool"); }
            public String greet(String who, int times){ counter++; return "Hi " + who + " x" + times + " (#" + counter + ")"; }
            public int add(int a, int b){ return a + b; }
            public void logIt(String s){ android.util.Log.i("ToolTest", s); }
            @Override protected void onCreate(Bundle b){
              super.onCreate(b);
              LinearLayout l = new LinearLayout(this); l.setOrientation(LinearLayout.VERTICAL);
              TextView t = new TextView(this); t.setText("libtool test app - tap TOOL button");
              EditText e = new EditText(this); e.setHint("name");
              Button btn = new Button(this); btn.setText("Call greet()");
              TextView out = new TextView(this);
              btn.setOnClickListener(v -> { out.setText(greet(e.getText().toString(), add(2,3))); logIt(out.getText().toString()); });
              l.addView(t); l.addView(e); l.addView(btn); l.addView(out);
              setContentView(l);
            }
          }
          EOF_JAVA
          cat > tools/inject.py <<'EOF_INJ'
          #!/usr/bin/env python3
          """Inject libtool.so into any APK. Requires: apktool, zipalign, apksigner, java.
          Usage: python3 inject.py app.apk --libs ./libs --out patched.apk
          libs dir must contain arm64-v8a/libtool.so and/or armeabi-v7a/libtool.so"""
          import argparse, os, re, shutil, subprocess, sys, tempfile, glob

          def run(cmd): subprocess.check_call(cmd)

          def main():
            ap = argparse.ArgumentParser()
            ap.add_argument('apk'); ap.add_argument('--libs', required=True)
            ap.add_argument('--out', default='patched.apk')
            ap.add_argument('--ks', default=os.path.expanduser('~/.android/debug.keystore'))
            ap.add_argument('--ks-pass', default='android')
            a = ap.parse_args()
            work = tempfile.mkdtemp(prefix='toolinject_')
            dec = os.path.join(work, 'dec')
            run(['apktool', 'd', '-f', '-o', dec, a.apk])
            # find launcher activity
            man = open(os.path.join(dec, 'AndroidManifest.xml'), encoding='utf-8').read()
            m = re.search(r'<activity[^>]*android:name="([^"]+)"[^>]*>(?:(?!</activity>).)*?LAUNCHER', man, re.S)
            if not m:
              m2 = re.search(r'<activity[^>]*android:name="([^"]+)"', man)
              if not m2: sys.exit('no activity found')
              name = m2.group(1)
            else: name = m.group(1)
            pkg = re.search(r'package="([^"]+)"', man).group(1)
            if name.startswith('.'): name = pkg + name
            smali = os.path.join(dec, 'smali*', *[])
            cands = glob.glob(os.path.join(dec, 'smali*', name.replace('.', os.sep) + '.smali'))
            if not cands: sys.exit('activity smali not found: ' + name)
            path = cands[0]
            src = open(path, encoding='utf-8').read()
            inject = ('    const-string v0, "tool"\n'
                      '    invoke-static {v0}, Ljava/lang/System;->loadLibrary(Ljava/lang/String;)V\n')
            om = re.search(r'(\.method[^\n]*onCreate\(Landroid/os/Bundle;\)V.*?\.locals (\d+))', src, re.S)
            if om:
              locals_n = int(om.group(2))
              if locals_n < 1:
                src = src.replace(om.group(1), om.group(1).replace('.locals 0', '.locals 1'), 1)
              idx = src.index(om.group(1)) + len(om.group(1))
              src = src[:idx] + '\n' + inject + src[idx:]
            else:
              src += ('\n.method public onCreate(Landroid/os/Bundle;)V\n    .locals 1\n'
                      + inject +
                      '    invoke-super {p0, p1}, Landroid/app/Activity;->onCreate(Landroid/os/Bundle;)V\n'
                      '    return-void\n.end method\n')
            open(path, 'w', encoding='utf-8').write(src)
            for abi in ('arm64-v8a', 'armeabi-v7a'):
              so = os.path.join(a.libs, abi, 'libtool.so')
              if os.path.exists(so):
                dst = os.path.join(dec, 'lib', abi); os.makedirs(dst, exist_ok=True)
                shutil.copy(so, dst)
            built = os.path.join(work, 'built.apk')
            run(['apktool', 'b', '-f', '-o', built, dec])
            aligned = os.path.join(work, 'aligned.apk')
            run(['zipalign', '-f', '4', built, aligned])
            if not os.path.exists(a.ks):
              run(['keytool', '-genkeypair', '-keystore', a.ks, '-alias', 'k', '-keyalg', 'RSA',
                   '-keysize', '2048', '-validity', '10000', '-storepass', a.ks_pass,
                   '-keypass', a.ks_pass, '-dname', 'CN=tool'])
            run(['apksigner', 'sign', '--ks', a.ks, '--ks-pass', 'pass:' + a.ks_pass,
                 '--out', a.out, aligned])
            print('OK ->', a.out)

          if __name__ == '__main__': main()
          EOF_INJ
          cat > README.md <<'EOF_README'
          # libtool — in-app Frida-powered ImGui runtime toolbox (no root / no frida-server / no gadget)

          One standalone `libtool.so`. Drop it into an APK's `lib/<abi>/`, add
          `System.loadLibrary("tool")` to the main activity, rebuild, sign, install.
          The ImGui menu renders on a translucent SurfaceView inside the app's own
          window — **no overlay permission**.

          ## How it works
          - Embeds **frida-gum + GumJS (QuickJS)** devkit statically (the only part of
            Frida we need — no frida-core, no server, no gadget, no root).
          - Bundles **frida-java-bridge** into the agent via frida-compile.
          - Java-side overlay/IME/lifecycle is done entirely from the agent
            (`Java.registerClass`), so the .so is truly self-contained.
          - UI: Dear ImGui (GLES3) on its own EGL surface + hidden EditText IME proxy.

          ## Tabs
          Settings / Patches / Hooks / Trackers / Dumper / Recorder / Monitor / Script / Classes.
          Classes windows are isolated (own filters), `+` adds windows, class search by
          class/method(name,return,param)/field(name,type), per-method Call/Patch/Track/Hook,
          per-field value/Set/Patch(lock)/Track(watch), instance Find (Java.choose) / Create,
          object-arg picker with find/create. Logs are clickable -> open caller class.

          ## Build
          Push `.github/workflows/tool.yml` to an empty repo and run the workflow.
          Artifacts: `libtool-arm64-v8a.so`, `libtool-armeabi-v7a.so`, signed
          `tooltest.apk`, `inject.py`, full sources (auto-committed on first run).

          ## Inject into your own APK
          python3 tools/inject.py app.apk --libs ./libs --out patched.apk
          (needs apktool, zipalign, apksigner on PATH)

          ## Crash logs & dumps
          Written to `Android/data/<pkg>/files/tool/` (always accessible), and copied
          to public **Downloads** via MediaStore on API 29+ (toggle in Settings).

          ## Honest limitations / roadmap
          - **Smali live edit = phase 2.** Plan: embed baksmali/smali (dexlib2) as a
            dex payload loaded with InMemoryDexClassLoader; disassemble target class,
            reassemble edited method, load and redirect via the hook dispatcher.
            UI slot exists; Java(JS) and Noop modes work today.
          - Field tracking is a 1s value-change watch (no ART field watchpoints).
          - Recorder hooks all methods under a scope prefix (capped 300 classes /
            3000 methods). Whole-app unbounded tracing is not practical in-process.
          - `Java.choose` depends on frida-java-bridge heap walking; may fail on some
            new ROMs. Monitor covers TLS plaintext + URL opens (OkHttp-specific
            request/response enrichment is phase 2).
          - If a pinned Frida devkit 404s, CI falls back to the latest 16.x release.
            If the gum C API ever changes arity, build with
            `-DCMAKE_CXX_FLAGS="-DGUM_CREATE_NO_SNAPSHOT -DGUM_POST_NO_DATA"`.

          Use only on apps you own or are authorized to test.

          ## Licenses
          Frida/gum: wxWindows Library Licence. frida-java-bridge: MIT.
          Dear ImGui: MIT. nlohmann/json: MIT. This repo: MIT.
          EOF_README

      - name: Commit generated sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "Generate libtool sources [skip ci]"; git push; }

      # ============================================================
      # 4) TOOLCHAIN + DEPS
      # ============================================================
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: nttld/setup-ndk@v1
        id: ndk
        with: { ndk-version: r26d }

      - name: Build agent.js
        run: |
          npm install --no-fund --no-audit frida-compile@^16 frida-java-bridge@^6
          mkdir -p build/generated
          npx frida-compile agent/index.js -o build/agent.js
          (cd build && xxd -i agent.js > generated/agent_js.h)

      - name: Fetch devkits / imgui / json
        run: |
          mkdir -p deps
          V="$FRIDA_VERSION"
          for ABI in arm64 arm; do
            URL="https://github.com/frida/frida/releases/download/$V/frida-gumjs-devkit-$V-android-$ABI.tar.xz"
            if ! curl -fL -o devkit-$ABI.tar.xz "$URL"; then
              V=$(curl -fsSL "https://api.github.com/repos/frida/frida/releases?per_page=100" | jq -r '[.[].tag_name | select(startswith("16."))][0]')
              URL="https://github.com/frida/frida/releases/download/$V/frida-gumjs-devkit-$V-android-$ABI.tar.xz"
              curl -fL -o devkit-$ABI.tar.xz "$URL"
            fi
            mkdir -p deps/gum-$ABI
            tar -xf devkit-$ABI.tar.xz -C deps/gum-$ABI
          done
          git clone --depth 1 --branch v1.90.9 https://github.com/ocornut/imgui deps/imgui
          mkdir -p deps/json/nlohmann
          curl -fL -o deps/json/nlohmann/json.hpp https://github.com/nlohmann/json/releases/download/v3.11.3/json.hpp

      # ============================================================
      # 5) NATIVE BUILD (both ABIs)
      # ============================================================
      - name: Build libtool.so
        run: |
          NDK="${{ steps.ndk.outputs.ndk-path }}"
          for PAIR in "arm64-v8a:arm64" "armeabi-v7a:arm"; do
            AABI="${PAIR%%:*}"; GABI="${PAIR##*:}"
            cmake -S . -B build/$AABI \
              -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$AABI -DANDROID_PLATFORM=android-26 \
              -DCMAKE_BUILD_TYPE=Release \
              -DGUM_DIR=$GITHUB_WORKSPACE/deps/gum-$GABI \
              -DIMGUI_DIR=$GITHUB_WORKSPACE/deps/imgui \
              -DJSON_DIR=$GITHUB_WORKSPACE/deps/json \
              -DGEN_DIR=$GITHUB_WORKSPACE/build/generated
            cmake --build build/$AABI -j$(nproc)
          done
          mkdir -p out/libs/arm64-v8a out/libs/armeabi-v7a
          cp build/arm64-v8a/libtool.so out/libs/arm64-v8a/
          cp build/armeabi-v7a/libtool.so out/libs/armeabi-v7a/

      # ============================================================
      # 6) TEST APK (built + signed)
      # ============================================================
      - name: Build test APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null
          BT=$ANDROID_HOME/build-tools/34.0.0
          PJ=$ANDROID_HOME/platforms/android-34/android.jar
          mkdir -p build/apk/obj
          $BT/aapt2 link --manifest testapp/AndroidManifest.xml -I "$PJ" \
            --min-sdk-version 26 --target-sdk-version 34 -o build/apk/base.apk
          javac -source 8 -target 8 -bootclasspath "$PJ" -d build/apk/obj \
            testapp/src/com/example/tooltest/MainActivity.java 2>/dev/null
          $BT/d8 --release --min-api 26 --lib "$PJ" --output build/apk \
            $(find build/apk/obj -name '*.class')
          (cd build/apk && zip -j base.apk classes.dex)
          cp -r out/libs build/apk/lib
          (cd build/apk && zip -r base.apk lib)
          $BT/zipalign -f 4 build/apk/base.apk build/apk/aligned.apk
          keytool -genkeypair -keystore build/debug.keystore -alias k -keyalg RSA \
            -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=tool"
          $BT/apksigner sign --ks build/debug.keystore --ks-pass pass:android \
            --key-pass pass:android --out out/tooltest.apk build/apk/aligned.apk

      - name: Collect artifacts
        run: |
          cp tools/inject.py out/
          cp README.md out/
          cp out/libs/arm64-v8a/libtool.so out/libtool-arm64-v8a.so
          cp out/libs/armeabi-v7a/libtool.so out/libtool-armeabi-v7a.so
          zip -r out/sources.zip native agent testapp tools CMakeLists.txt README.md .github

      - uses: actions/upload-artifact@v4
        with:
          name: libtool-android
          path: out/*
