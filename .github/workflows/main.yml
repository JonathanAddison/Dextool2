name: libtool-fix-build
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply compile fixes + strong diagnostics
        run: |
          [ -f native/ui.cpp ] || { echo "sources missing - run the original generator workflow first"; exit 1; }
          python3 - <<'PY'
          import sys
          def rep(path,old,new):
              s=open(path,encoding='utf-8').read()
              if old in s:
                  open(path,'w',encoding='utf-8').write(s.replace(old,new,1)); print('patched',path)
              elif new in s:
                  print('already',path)
              else:
                  print('MISS',path,repr(old[:70])); sys.exit(1)

          # ---- ui.cpp compile fixes ----
          rep('native/ui.cpp','static int req(){ return G.nextReq++; }',
              'static int req(){ return G.nextReq++; }\nstatic json patchJson(const PatchRec& p);\nstatic json hookJson(const HookRec& h);')
          rep('native/ui.cpp',
          '''void openClass(const std::string& cls,long long h){
            ClassWindow w; w.id=G.nextWin++; w.isList=false; w.cls=cls; w.handle=h;
            w.title=h?(cls+" @"+std::to_string(h)):cls;
            G.wins.push_back(w); G.activeWin=w.id;
            bridge::post({{"t","info"},{"id",req()},{"cls",cls},{"h",h},{"ctx",{{"w",w.id},{"k","info"}}}});
          }''',
          '''static std::vector<std::pair<std::string,long long>> g_openQueue;
          void openClass(const std::string& cls,long long h){ g_openQueue.push_back({cls,h}); }
          static void flushOpen(){
            for(auto& q:g_openQueue){
              ClassWindow w; w.id=G.nextWin++; w.isList=false; w.cls=q.first; w.handle=q.second;
              w.title=q.second?(q.first+" @"+std::to_string(q.second)):q.first;
              G.wins.push_back(w); G.activeWin=w.id;
              bridge::post({{"t","info"},{"id",req()},{"cls",q.first},{"h",q.second},{"ctx",{{"w",w.id},{"k","info"}}}});
            }
            g_openQueue.clear();
          }''')
          rep('native/ui.cpp',
              'void draw(){\n  std::lock_guard<std::mutex> lk(G.mtx);\n  ImGuiIO& io=ImGui::GetIO();',
              'void draw(){\n  std::lock_guard<std::mutex> lk(G.mtx);\n  flushOpen();\n  ImGuiIO& io=ImGui::GetIO();')
          rep('native/ui.cpp','static void tabPatches(){','static void tabPatches(){\n  std::vector<std::string> del;')
          rep('native/ui.cpp','G.patches.erase(id); ImGui::TreePop(); ImGui::PopID(); continue;',
              'del.push_back(id); if(open) ImGui::TreePop(); ImGui::PopID(); continue;')
          rep('native/ui.cpp','if(G.patches.empty()) ImGui::TextDisabled("No patches. Register from Classes tab.");',
              'for(auto& d:del) G.patches.erase(d);\n  if(G.patches.empty()) ImGui::TextDisabled("No patches. Register from Classes tab.");')
          rep('native/ui.cpp','static void tabHooks(){','static void tabHooks(){\n  std::vector<std::string> del;')
          rep('native/ui.cpp','G.hooks.erase(id); if(open)ImGui::TreePop();','del.push_back(id); if(open)ImGui::TreePop();')
          rep('native/ui.cpp','if(G.hooks.empty()) ImGui::TextDisabled("No hooks. Register from Classes tab.");',
              'for(auto& d:del) G.hooks.erase(d);\n  if(G.hooks.empty()) ImGui::TextDisabled("No hooks. Register from Classes tab.");')
          rep('native/ui.cpp','static void tabTrackers(){','static void tabTrackers(){\n  std::vector<std::string> del;')
          rep('native/ui.cpp','G.tracks.erase(id); if(open)ImGui::TreePop();','del.push_back(id); if(open)ImGui::TreePop();')
          rep('native/ui.cpp','if(G.tracks.empty()) ImGui::TextDisabled("No trackers. Register from Classes tab.");',
              'for(auto& d:del) G.tracks.erase(d);\n  if(G.tracks.empty()) ImGui::TextDisabled("No trackers. Register from Classes tab.");')
          # ---- ui.cpp diagnostics include + export button ----
          rep('native/ui.cpp','#include "state.h"\n#include <imgui.h>',
              '#include "state.h"\n#include "diag.h"\n#include <imgui.h>')
          rep('native/ui.cpp',
              '  ImGui::Separator();\n  ImGui::TextDisabled("libtool phase 1 - frida-gum embedded, no root/server/gadget.");',
              '  if(ImGui::Button("Export logs to Downloads")){ tool_export_logs(); toast("exporting logs..."); }\n'
              '  ImGui::TextWrapped("Diagnostics dir: %s", diag::dir().c_str());\n'
              '  ImGui::Separator();\n  ImGui::TextDisabled("libtool phase 1 - frida-gum embedded, no root/server/gadget.");')
          # ---- CMake ----
          rep('CMakeLists.txt','native/main.cpp native/renderer.cpp native/ui.cpp',
              'native/main.cpp native/renderer.cpp native/ui.cpp native/diag.cpp')
          rep('CMakeLists.txt','EGL GLESv3 android log dl m)','EGL GLESv3 android log dl m atomic)')
          # ---- agent error breadcrumbs ----
          rep('agent/index.js',"catch(e){ send({t:'toast', msg:''+e}); }",
              "catch(e){ send({t:'toast', msg:''+e}); send({t:'diag', msg:'dispatch: '+e}); }")
          rep('agent/index.js',"send({t:'ready'});",
              "send({t:'diag', msg:'agent ready'});\n    send({t:'ready'});")
          print('UI/CMAKE/AGENT PATCHES OK')
          PY

          cat > native/diag.h <<'EOF_DIAGH'
          #pragma once
          #include <string>
          #include <jni.h>
          namespace diag {
            void init(JavaVM* vm);
            void log(const char* fmt,...);
            void setDir(const std::string& d);
            std::string dir();
            void publishAll();
          }
          extern "C" void tool_export_logs();
          EOF_DIAGH

          cat > native/diag.cpp <<'EOF_DIAG'
          #include "diag.h"
          #include <android/log.h>
          #include <cstdarg>
          #include <cstdio>
          #include <cstring>
          #include <cstdlib>
          #include <ctime>
          #include <unistd.h>
          #include <fcntl.h>
          #include <dirent.h>
          <sys/stat.h>
          #include <sys/system_properties.h>
          #include <csignal>
          #include <unwind.h>
          #include <dlfcn.h>
          #include <thread>
          #include <mutex>
          #include <vector>
          #define TAG "libtool"
          static JavaVM* g_vm=nullptr;
          static char g_dir[512]={0}, g_pkg[256]={0};
          static int g_fd=-1;
          static char g_ring[64][256]; static int g_ringN=0;
          static std::mutex g_mtx;
          static struct sigaction g_old[64];
          static void mkdirs(const char* p){ char t[512]; strncpy(t,p,511); t[511]=0;
            for(char* q=t+1;*q;q++){ if(*q=='/'){ *q=0; mkdir(t,0771); *q='/'; } } mkdir(t,0771); }
          static void detect(){
            FILE* f=fopen("/proc/self/cmdline","r");
            if(f){ size_t n=fread(g_pkg,1,255,f); fclose(f); g_pkg[n]=0;
              for(char* q=g_pkg;*q;q++) if(*q==':'||*q=='\n'||*q==' ') *q=0; }
            if(!g_pkg[0]) strcpy(g_pkg,"unknown");
            snprintf(g_dir,sizeof g_dir,"/data/data/%s/files/tool",g_pkg);
            mkdirs(g_dir);
            char pend[600]; snprintf(pend,sizeof pend,"%s/pending",g_dir); mkdirs(pend);
            char lp[600]; snprintf(lp,sizeof lp,"%s/diag.log",g_dir);
            g_fd=open(lp,O_CREAT|O_APPEND|O_WRONLY,0660);
          }
          namespace diag {
          std::string dir(){ return g_dir; }
          void setDir(const std::string& d){ if(!d.empty()) mkdirs(d.c_str()); }
          void log(const char* fmt,...){
            char buf[256]; va_list ap; va_start(ap,fmt); vsnprintf(buf,sizeof buf,fmt,ap); va_end(ap);
            char line[320]; snprintf(line,sizeof line,"[%ld] %s\n",(long)time(nullptr),buf);
            { std::lock_guard<std::mutex> lk(g_mtx);
              strncpy(g_ring[g_ringN%64],line,255); g_ring[g_ringN%64][255]=0; g_ringN++;
              if(g_fd>=0) write(g_fd,line,strlen(line)); }
            __android_log_print(ANDROID_LOG_INFO,TAG,"%s",buf);
          }
          }
          struct BtState{ void** cur; void** end; };
          static _Unwind_Reason_Code btCb(_Unwind_Context* c,void* p){
            BtState* s=(BtState*)p; void* pc=(void*)_Unwind_GetIP(c);
            if(s->cur<s->end)*s->cur++=pc; return _URC_NO_REASON; }
          static void crashHandler(int sig,siginfo_t* si,void*){
            char path[700]; snprintf(path,sizeof path,"%s/pending/crash_%ld_%d.txt",g_dir,(long)time(nullptr),sig);
            int fd=open(path,O_CREAT|O_WRONLY|O_TRUNC,0660);
            if(fd>=0){
              char b[512]; int n;
              n=snprintf(b,sizeof b,"signal %d addr %p pid %d tid %d pkg %s\n",sig,si->si_addr,getpid(),gettid(),g_pkg); write(fd,b,n);
              char fp[92]; __system_property_get("ro.build.fingerprint",fp);
              n=snprintf(b,sizeof b,"build %s\n",fp); write(fd,b,n);
              int count=g_ringN<64?g_ringN:64, start=g_ringN-count;
              for(int i=0;i<count;i++){ const char* l=g_ring[(start+i)%64]; write(fd,l,strlen(l)); }
              void* bt[64]; BtState s{bt,bt+64}; _Unwind_Backtrace(btCb,&s);
              for(void** p=bt;p<s.cur;p++){ Dl_info di;
                if(dladdr(*p,&di)) n=snprintf(b,sizeof b,"%s (%s+0x%lx)\n",di.dli_fname,di.dli_sname?di.dli_sname:"?",(unsigned long)((char*)*p-(char*)di.dli_saddr));
                else n=snprintf(b,sizeof b,"%p\n",*p); write(fd,b,n); }
              int m=open("/proc/self/maps",O_RDONLY);
              if(m>=0){ char mb[4096]; ssize_t r; while((r=read(m,mb,sizeof mb))>0) write(fd,mb,r); close(m); }
              fsync(fd); close(fd);
            }
            __android_log_print(ANDROID_LOG_ERROR,TAG,"crash %d -> %s",sig,path);
            sigaction(sig,&g_old[sig],nullptr); raise(sig);
          }
          static void installCrash(){
            struct sigaction sa{}; sa.sa_sigaction=crashHandler; sa.sa_flags=SA_SIGINFO|SA_RESETHAND;
            for(int s:{SIGSEGV,SIGABRT,SIGBUS,SIGFPE,SIGILL,SIGSYS}) sigaction(s,&sa,&g_old[s]);
          }
          static bool getCtx(JNIEnv* env,jobject* out){
            jclass at=env->FindClass("android/app/ActivityThread");
            if(!at){ env->ExceptionClear(); return false; }
            jmethodID m=env->GetStaticMethodID(at,"currentApplication","()Landroid/app/Application;");
            jobject app=env->CallStaticObjectMethod(at,m);
            if(env->ExceptionCheck()) env->ExceptionClear();
            if(!app){ env->DeleteLocalRef(at); return false; }
            jclass cc=env->FindClass("android/content/Context");
            jmethodID gc=env->GetMethodID(cc,"getApplicationContext","()Landroid/content/Context;");
            jobject ctx=env->CallObjectMethod(app,gc);
            env->DeleteLocalRef(app); env->DeleteLocalRef(at); env->DeleteLocalRef(cc);
            if(!ctx) return false; *out=ctx; return true;
          }
          static void publishOne(JNIEnv* env,jobject resolver,jobject dUri,jclass cvCls,jmethodID cvInit,
              jmethodID put,jmethodID insert,jmethodID openOS,jmethodID write,jmethodID close,
              const std::string& path,bool renameAfter){
            FILE* f=fopen(path.c_str(),"rb"); if(!f) return;
            fseek(f,0,SEEK_END); long sz=ftell(f); fseek(f,0,SEEK_SET);
            if(sz<=0||sz>8*1024*1024){ fclose(f); return; }
            std::vector<char> buf(sz); fread(buf.data(),1,sz,f); fclose(f);
            std::string base=path.substr(path.find_last_of('/')+1);
            std::string name="libtool_"+base;
            jobject cv=env->NewObject(cvCls,cvInit);
            jstring jn=env->NewStringUTF(name.c_str()), jm=env->NewStringUTF("text/plain");
            jstring k1=env->NewStringUTF("_display_name"), k2=env->NewStringUTF("mime_type");
            env->CallVoidMethod(cv,put,k1,jn); env->CallVoidMethod(cv,put,k2,jm);
            jobject outUri=env->CallObjectMethod(resolver,insert,dUri,cv);
            if(env->ExceptionCheck()) env->ExceptionClear();
            bool ok=false;
            if(outUri){
              jobject os=env->CallObjectMethod(resolver,openOS,outUri);
              if(env->ExceptionCheck()) env->ExceptionClear();
              if(os){
                jbyteArray arr=env->NewByteArray(sz);
                env->SetByteArrayRegion(arr,0,sz,(jbyte*)buf.data());
                env->CallVoidMethod(os,write,arr,0,(jint)sz);
                env->CallVoidMethod(os,close);
                if(env->ExceptionCheck()) env->ExceptionClear(); else ok=true;
                env->DeleteLocalRef(arr); env->DeleteLocalRef(os);
              }
              env->DeleteLocalRef(outUri);
            }
            env->DeleteLocalRef(cv);env->DeleteLocalRef(jn);env->DeleteLocalRef(jm);
            env->DeleteLocalRef(k1);env->DeleteLocalRef(k2);
            if(ok&&renameAfter){ std::string done=path+".published"; rename(path.c_str(),done.c_str()); }
          }
          static void publishAll(){
            if(!g_vm) return;
            JNIEnv* env=nullptr;
            if(g_vm->AttachCurrentThread(&env,nullptr)!=0) return;
            jobject ctx=nullptr;
            for(int i=0;i<40&&!ctx;i++){ if(getCtx(env,&ctx)) break; usleep(250000); }
            if(!ctx){ g_vm->DetachCurrentThread(); return; }
            jclass bv=env->FindClass("android/os/Build$VERSION");
            int sdk=env->GetStaticIntField(bv,env->GetStaticFieldID(bv,"SDK_INT","I"));
            jclass cc=env->FindClass("android/content/Context");
            jobject resolver=env->CallObjectMethod(ctx,env->GetMethodID(cc,"getContentResolver","()Landroid/content/ContentResolver;"));
            if(sdk>=29&&resolver){
              jclass ms=env->FindClass("android/provider/MediaStore$Downloads");
              jobject dUri=env->GetStaticObjectField(ms,env->GetStaticFieldID(ms,"EXTERNAL_CONTENT_URI","Landroid/net/Uri;"));
              jclass cvCls=env->FindClass("android/content/ContentValues");
              jmethodID cvInit=env->GetMethodID(cvCls,"<init>","()V");
              jmethodID put=env->GetMethodID(cvCls,"put","(Ljava/lang/String;Ljava/lang/String;)V");
              jclass cr=env->FindClass("android/content/ContentResolver");
              jmethodID insert=env->GetMethodID(cr,"insert","(Landroid/net/Uri;Landroid/content/ContentValues;)Landroid/net/Uri;");
              jmethodID openOS=env->GetMethodID(cr,"openOutputStream","(Landroid/net/Uri;)Ljava/io/OutputStream;");
              jclass osCls=env->FindClass("java/io/OutputStream");
              jmethodID write=env->GetMethodID(osCls,"write","([BII)V");
              jmethodID close=env->GetMethodID(osCls,"close","()V");
              std::vector<std::string> files;
              char pend[600]; snprintf(pend,sizeof pend,"%s/pending",g_dir);
              DIR* d=opendir(pend);
              if(d){ dirent* e; while((e=readdir(d))){ std::string nm=e->d_name;
                if(nm[0]=='.'||nm.size()>10&&nm.substr(nm.size()-10)==".published") continue;
                files.push_back(std::string(pend)+"/"+nm); } closedir(d); }
              for(auto& p:files) publishOne(env,resolver,dUri,cvCls,cvInit,put,insert,openOS,write,close,p,true);
              std::string diagp=std::string(g_dir)+"/diag.log";
              publishOne(env,resolver,dUri,cvCls,cvInit,put,insert,openOS,write,close,diagp,false);
              env->DeleteLocalRef(ms);env->DeleteLocalRef(dUri);env->DeleteLocalRef(cvCls);
              env->DeleteLocalRef(cr);env->DeleteLocalRef(osCls);
            }
            if(resolver) env->DeleteLocalRef(resolver);
            env->DeleteLocalRef(ctx); env->DeleteLocalRef(cc); env->DeleteLocalRef(bv);
            g_vm->DetachCurrentThread();
          }
          namespace diag { void publishAll(){ ::publishAll(); } }
          extern "C" void tool_export_logs(){ std::thread([]{ publishAll(); }).detach(); }
          namespace diag {
          void init(JavaVM* vm){
            g_vm=vm; detect(); installCrash();
            log("diag init dir=%s pkg=%s",g_dir,g_pkg);
            std::thread([]{ usleep(1500000); publishAll(); }).detach();
          }
          }
          EOF_DIAG

          cat > native/main.cpp <<'EOF_MAIN'
          #include "state.h"
          #include "diag.h"
          #include <frida-gumjs.h>
          #include <jni.h>
          #include <agent_js.h>
          #include <thread>
          static GumScript* g_script=nullptr; static GMainContext* g_ctx=nullptr;
          static void onMessage(const gchar* msg, GBytes* data, gpointer){
            json j; try{ j=json::parse(msg); }catch(...){
              std::lock_guard<std::mutex> lk(G.mtx);
              G.scriptLog.push_back({msg?msg:"(bad json)","",{},{}}); return; }
            std::string t=j.value("t","");
            if(t=="diag"){ diag::log("agent: %s",j.value("msg","").c_str()); return; }
            if(data && t=="dex"){
              gsize n=0; gconstpointer p=g_bytes_get_data(data,&n);
              std::string name=j.value("name","classes.dex");
              std::string path=diag::dir()+"/"+name;
              FILE* f=fopen(path.c_str(),"wb"); if(f){ fwrite(p,1,n,f); fclose(f); }
              diag::log("dex dumped %s (%zu bytes)",path.c_str(),(size_t)n);
              std::lock_guard<std::mutex> lk(G.mtx);
              G.dumped.push_back({path,(long long)n}); ui::toast("dumped "+path);
              return; }
            ui::route(j);
          }
          static gboolean doPost(gpointer p){
            char* s=(char*)p; gum_script_post(g_script,s,nullptr); g_free(s); return G_SOURCE_REMOVE; }
          namespace bridge {
            void post(const json& j){
              if(!g_script||!g_ctx) return;
              json m=j; m["type"]="cmd";
              g_main_context_invoke(g_ctx,doPost,g_strdup(m.dump().c_str())); }
          }
          static void gumThread(){
            diag::log("gum thread start");
            gum_init_embedded();
            g_ctx=g_main_context_new(); g_main_context_push_thread_default(g_ctx);
            GMainLoop* loop=g_main_loop_new(g_ctx,FALSE);
            GumScriptBackend* be=gum_script_backend_obtain_qjs();
            diag::log("qjs backend ok");
            GError* err=nullptr;
            std::string src((const char*)agent_js,agent_js_len);
            g_script=gum_script_backend_create_sync(be,"tool",src.c_str(),nullptr,nullptr,&err);
            if(err){ diag::log("script create ERROR: %s",err->message); return; }
            diag::log("script created");
            gum_script_set_message_handler(g_script,onMessage,nullptr,nullptr);
            gum_script_load_sync(g_script,nullptr);
            diag::log("script loaded");
            g_main_loop_run(loop);
          }
          extern "C" JNIEXPORT jint JNI_OnLoad(JavaVM* vm,void*){
            diag::init(vm);
            diag::log("JNI_OnLoad");
            std::thread(gumThread).detach();
            return JNI_VERSION_1_6;
          }
          void toolSetDir(const std::string& d){ diag::setDir(d); }
          EOF_MAIN

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "fix build + strong no-adb diagnostics [skip ci]"; git push; }

      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: nttld/setup-ndk@v1
        id: ndk
        with: { ndk-version: r26d }

      - name: Build agent.js
        run: |
          npm install --no-fund --no-audit frida-compile@^16 frida-java-bridge@^6
          mkdir -p build/generated
          npx frida-compile agent/index.js -o build/agent.js
          (cd build && xxd -i agent.js > generated/agent_js.h)

      - name: Fetch devkits / imgui / json
        run: |
          mkdir -p deps
          V="${FRIDA_VERSION:-16.7.19}"
          for ABI in arm64 arm; do
            URL="https://github.com/frida/frida/releases/download/$V/frida-gumjs-devkit-$V-android-$ABI.tar.xz"
            if ! curl -fL -o devkit-$ABI.tar.xz "$URL"; then
              V=$(curl -fsSL "https://api.github.com/repos/frida/frida/releases?per_page=100" | jq -r '[.[].tag_name | select(startswith("16."))][0]')
              URL="https://github.com/frida/frida/releases/download/$V/frida-gumjs-devkit-$V-android-$ABI.tar.xz"
              curl -fL -o devkit-$ABI.tar.xz "$URL"
            fi
            mkdir -p deps/gum-$ABI; tar -xf devkit-$ABI.tar.xz -C deps/gum-$ABI
          done
          git clone --depth 1 --branch v1.90.9 https://github.com/ocornut/imgui deps/imgui
          mkdir -p deps/json/nlohmann
          curl -fL -o deps/json/nlohmann/json.hpp https://github.com/nlohmann/json/releases/download/v3.11.3/json.hpp

      - name: Build libtool.so
        run: |
          NDK="${{ steps.ndk.outputs.ndk-path }}"
          for PAIR in "arm64-v8a:arm64" "armeabi-v7a:arm"; do
            AABI="${PAIR%%:*}"; GABI="${PAIR##*:}"
            cmake -S . -B build/$AABI -Wno-deprecated \
              -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$AABI -DANDROID_PLATFORM=android-26 \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_WARN_DEPRECATED=OFF \
              -DGUM_DIR=$GITHUB_WORKSPACE/deps/gum-$GABI \
              -DIMGUI_DIR=$GITHUB_WORKSPACE/deps/imgui \
              -DJSON_DIR=$GITHUB_WORKSPACE/deps/json \
              -DGEN_DIR=$GITHUB_WORKSPACE/build/generated
            cmake --build build/$AABI -j$(nproc)
          done
          mkdir -p out/libs/arm64-v8a out/libs/armeabi-v7a
          cp build/arm64-v8a/libtool.so out/libs/arm64-v8a/
          cp build/armeabi-v7a/libtool.so out/libs/armeabi-v7a/

      - name: Build test APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null
          BT=$ANDROID_HOME/build-tools/34.0.0
          PJ=$ANDROID_HOME/platforms/android-34/android.jar
          mkdir -p build/apk/obj
          $BT/aapt2 link --manifest testapp/AndroidManifest.xml -I "$PJ" \
            --min-sdk-version 26 --target-sdk-version 34 -o build/apk/base.apk
          javac -source 8 -target 8 -bootclasspath "$PJ" -d build/apk/obj \
            testapp/src/com/example/tooltest/MainActivity.java 2>/dev/null
          $BT/d8 --release --min-api 26 --lib "$PJ" --output build/apk $(find build/apk/obj -name '*.class')
          (cd build/apk && zip -j base.apk classes.dex)
          cp -r out/libs build/apk/lib
          (cd build/apk && zip -r base.apk lib)
          $BT/zipalign -f 4 build/apk/base.apk build/apk/aligned.apk
          keytool -genkeypair -keystore build/debug.keystore -alias k -keyalg RSA \
            -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=tool"
          $BT/apksigner sign --ks build/debug.keystore --ks-pass pass:android \
            --key-pass pass:android --out out/tooltest.apk build/apk/aligned.apk

      - name: Collect artifacts
        run: |
          cp tools/inject.py out/ 2>/dev/null || true
          cp README.md out/ 2>/dev/null || true
          cp out/libs/arm64-v8a/libtool.so out/libtool-arm64-v8a.so
          cp out/libs/armeabi-v7a/libtool.so out/libtool-armeabi-v7a.so
          zip -r out/sources.zip native agent testapp tools CMakeLists.txt README.md .github

      - uses: actions/upload-artifact@v4
        with:
          name: libtool-android
          path: out/*
