          static void drawStack(const std::vector<StackFrame>& st){
            for(auto& f:st){ ImGui::PushStyleColor(ImGuiCol_Text,typeCol("obj"));
              if(ImGui::Selectable(f.s.c_str())) openClass(f.c);
              ImGui::PopStyleColor(); }
