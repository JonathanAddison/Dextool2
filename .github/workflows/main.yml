name: libtool-build
on:
  workflow_dispatch:
    inputs:
      frida_version:
        description: "Frida gumjs devkit version"
        default: "16.7.19"
  push:
    paths: [".github/workflows/tool.yml", "native/**", "agent/**", "CMakeLists.txt"]
permissions:
  contents: write
env:
  FRIDA_VERSION: ${{ inputs.frida_version || '16.7.19' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ============================================================
      # 1) WRITE PROJECT SOURCES (only on first run; then editable)
      # ============================================================
      - name: Generate build files
        run: |
          [ -f CMakeLists.txt ] && exit 0
          cat > CMakeLists.txt <<'EOF_CMAKE'
          cmake_minimum_required(VERSION 3.22)
          project(tool C CXX)
          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_POSITION_INDEPENDENT_CODE ON)
          add_library(tool SHARED
            native/main.cpp native/renderer.cpp native/ui.cpp
            ${IMGUI_DIR}/imgui.cpp ${IMGUI_DIR}/imgui_draw.cpp
            ${IMGUI_DIR}/imgui_tables.cpp ${IMGUI_DIR}/imgui_widgets.cpp
            ${IMGUI_DIR}/backends/imgui_impl_opengl3.cpp
            ${IMGUI_DIR}/misc/cpp/imgui_stdlib.cpp)
          target_include_directories(tool PRIVATE
            native ${GUM_DIR} ${IMGUI_DIR} ${IMGUI_DIR}/backends
            ${IMGUI_DIR}/misc/cpp ${JSON_DIR} ${GEN_DIR})
          target_compile_definitions(tool PRIVATE IMGUI_IMPL_OPENGL_ES3)
          target_compile_options(tool PRIVATE -ffunction-sections -fdata-sections -fvisibility=hidden -O2)
          target_link_options(tool PRIVATE
            -Wl,--gc-sections -Wl,--exclude-libs,ALL -s
            -Wl,--version-script=${CMAKE_SOURCE_DIR}/native/exports.map)
          target_link_libraries(tool PRIVATE
            ${GUM_DIR}/libfrida-gumjs.a EGL GLESv3 android log dl m)
          EOF_CMAKE
          mkdir -p native
          cat > native/exports.map <<'EOF_MAP'
          { global: JNI_OnLoad; tool_surface; tool_surface_resize; tool_surface_destroy; tool_touch; tool_text; tool_special; local: *; };
          EOF_MAP

      - name: Generate native state.h
        run: |
          [ -f native/state.h ] && exit 0
          cat > native/state.h <<'EOF_STATE'
          #pragma once
          #include <string>
          #include <vector>
          #include <map>
          #include <deque>
          #include <mutex>
          #include <atomic>
          #include <nlohmann/json.hpp>
          using json = nlohmann::json;

          // ---- wire value encoding: {k:"skip"|"null"|"prim"|"str"|"obj", v?, h?}
          struct MethodInfo { std::string n, mods, ret; std::vector<std::string> p; bool st=false; int ov=-1; };
          struct FieldInfo  { std::string n, mods, t, v; bool st=false; };
          struct InstanceInfo { long long h=0; std::string label; };
          struct StackFrame { std::string c, s; };
          struct LogEntry { std::string text, cls; std::vector<StackFrame> stack; json raw; };
          struct PatchRec { std::string id, cls, member, type, retType; bool isField=false, enabled=true, lock=false;
                            int ov=-1; std::vector<std::string> params; std::vector<json> args; json ret; };
          struct HookRec  { std::string id, cls, name, mode="java", code, ret; bool enabled=true; int ov=-1;
                            std::vector<std::string> params; };
          struct TrackRec { std::string id, cls, member; bool isField=false, enabled=true; std::deque<LogEntry> log; };

          struct ArgEditor {
            std::vector<std::string> types; std::vector<json> vals;
            int popupFor=-1; std::vector<InstanceInfo> results; bool busy=false;
            void init(const std::vector<std::string>& t, bool patchMode){
              types=t; vals.assign(t.size(), json{{"k", patchMode?"skip":"prim"},{"v",""}});
              for(size_t i=0;i<t.size();i++) if(!isText(t[i])) vals[i]=json{{"k","null"}};
            }
            static bool isText(const std::string& t){
              return t=="int"||t=="long"||t=="short"||t=="byte"||t=="float"||t=="double"
                  ||t=="boolean"||t=="char"||t=="java.lang.String"||t=="java.lang.CharSequence";
            }
          };
          struct MemberUI {
            bool call=false, patch=false, track=false, hook=false;
            ArgEditor callArgs, patchArgs; json patchRet=json{{"k","skip"},{"v",""}}; bool patchRetOn=false;
            std::string hookMode="java", hookCode, callResult, fieldVal; bool fieldLock=false, fieldTrack=false;
            std::deque<LogEntry> callLog;
          };
          struct ClassWindow {
            int id=0; bool isList=true, open=true, loaded=false, searching=false;
            std::string title="Classes", cls; long long handle=0;
            char filter[256]={0}; int mode=0, sub=0;
            std::vector<std::string> results;
            char mfilter[256]={0};
            std::vector<MethodInfo> methods; std::vector<FieldInfo> fields; json ctors=json::array();
            bool instPanel=false, creating=false; int ctorSel=0; ArgEditor ctorArgs;
            std::vector<InstanceInfo> instances;
            std::map<std::string, MemberUI> mu;
          };
          struct Settings {
            float fontScale=1.0f, opacity=0.95f; int theme=0, logCap=2000;
            bool publishDownloads=true, crashHandler=true;
            std::string dir, pkg; int sdk=0;
          };
          struct AppState {
            std::mutex mtx;
            std::vector<ClassWindow> wins; int activeWin=-1, nextWin=1, nextReq=1;
            std::map<std::string, PatchRec> patches;
            std::map<std::string, HookRec> hooks;
            std::map<std::string, TrackRec> tracks;
            std::deque<LogEntry> recordLog, monitorLog, scriptLog;
            std::vector<std::pair<std::string,long long>> dumped;
            std::deque<std::pair<std::string,float>> toasts;
            Settings cfg; bool menuOpen=false, recorderOn=false, monitorOn=false;
            char scriptBuf[65536]={0}; char recScope[256]={0};
            int monitorDetail=-1;
          };
          inline AppState G;

          namespace ui { void draw(); void openClass(const std::string& cls, long long h=0);
                         void toast(const std::string& s); void route(const json& j); }
          namespace bridge { void post(const json& j); }
          EOF_STATE

      - name: Generate native main.cpp (JNI + gum bridge + crash)
        run: |
          [ -f native/main.cpp ] && exit 0
          cat > native/main.cpp <<'EOF_MAIN'
          #include "state.h"
          #include <frida-gumjs.h>
          #include <jni.h>
          #include <android/log.h>
          #include <agent_js.h>
          #include <thread>
          #include <fstream>
          #include <sstream>
          #include <csignal>
          #include <cstring>
          #include <unwind.h>
          #include <dlfcn.h>
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO,"libtool",__VA_ARGS__)
          #define LOGE(...) __android_log_print(ANDROID_LOG_ERROR,"libtool",__VA_ARGS__)

          static GumScript* g_script=nullptr; static GMainContext* g_ctx=nullptr;
          static std::string g_dir;

          // ---------- crash handler ----------
          struct BtState { void** cur; void** end; };
          static _Unwind_Reason_Code btCb(_Unwind_Context* c, void* p){
            BtState* s=(BtState*)p; void* pc=(void*)_Unwind_GetIP(c);
            if(s->cur<s->end) *s->cur++=pc; return _URC_NO_REASON;
          }
          static struct sigaction g_old[64];
          static void crashHandler(int sig, siginfo_t* si, void*){
            LOGE("crash signal %d addr %p", sig, si->si_addr);
            if(!g_dir.empty()){
              char path[512]; snprintf(path,sizeof path,"%s/crash_%ld.txt",g_dir.c_str(),(long)time(nullptr));
              FILE* f=fopen(path,"w");
              if(f){
                fprintf(f,"signal %d fault %p\n",sig,si->si_addr);
                void* bt[64]; BtState s{bt,bt+64}; _Unwind_Backtrace(btCb,&s);
                for(void** p=bt;p<s.cur;p++){ Dl_info di; if(dladdr(*p,&di))
                  fprintf(f,"%s (%s+0x%lx)\n",di.dli_fname,di.dli_sname?di.dli_sname:"?",
                          (unsigned long)((char*)*p-(char*)di.dli_saddr)); else fprintf(f,"%p\n",*p); }
                fclose(f);
              }
            }
            sigaction(sig,&g_old[sig],nullptr); raise(sig);
          }
          static void installCrash(){
            struct sigaction sa{}; sa.sa_sigaction=crashHandler; sa.sa_flags=SA_SIGINFO|SA_RESETHAND;
            for(int s:{SIGSEGV,SIGABRT,SIGBUS,SIGFPE,SIGILL}) sigaction(s,&sa,&g_old[s]);
          }

          // ---------- agent message sink ----------
          static void onMessage(GumScript*, const gchar* msg, GBytes* data, gpointer){
            json j; try{ j=json::parse(msg); }catch(...){
              std::lock_guard<std::mutex> lk(G.mtx);
              G.scriptLog.push_back({msg?msg:"(bad json)","",{},{}}); return;
            }
            if(data && j.value("t","")=="dex"){
              gsize n=0; gconstpointer p=g_bytes_get_data(data,&n);
              std::string name=j.value("name","classes.dex");
              std::string path=g_dir.empty()?("/data/local/tmp/"+name):(g_dir+"/"+name);
              FILE* f=fopen(path.c_str(),"wb"); if(f){ fwrite(p,1,n,f); fclose(f); }
              std::lock_guard<std::mutex> lk(G.mtx);
              G.dumped.push_back({path,(long long)n}); ui::toast("dumped "+path);
              return;
            }
            ui::route(j);
          }
          static gboolean doPost(gpointer p){
            char* s=(char*)p;
          #ifdef GUM_POST_NO_DATA
            gum_script_post(g_script,s);
          #else
            gum_script_post(g_script,s,nullptr);
          #endif
            g_free(s); return G_SOURCE_REMOVE;
          }
          namespace bridge {
            void post(const json& j){
              if(!g_script||!g_ctx) return;
              json m=j; m["type"]="cmd";
              g_main_context_invoke(g_ctx,doPost,g_strdup(m.dump().c_str()));
            }
          }
          static void gumThread(){
            gum_init_embedded();
            g_ctx=g_main_context_new(); g_main_context_push_thread_default(g_ctx);
            GMainLoop* loop=g_main_loop_new(g_ctx,FALSE);
            GumScriptBackend* be=gum_script_backend_obtain_qjs();
            GError* err=nullptr;
            std::string src((const char*)agent_js,agent_js_len);
          #ifdef GUM_CREATE_NO_SNAPSHOT
            g_script=gum_script_backend_create_sync(be,"tool",src.c_str(),nullptr,&err);
          #else
            g_script=gum_script_backend_create_sync(be,"tool",src.c_str(),nullptr,nullptr,&err);
          #endif
            if(err){ LOGE("script create: %s",err->message); return; }
            gum_script_set_message_handler(g_script,onMessage,nullptr,nullptr);
            gum_script_load_sync(g_script,nullptr,&err);
            if(err){ LOGE("script load: %s",err->message); return; }
            LOGI("agent loaded");
            g_main_loop_run(loop);
          }
          extern "C" JNIEXPORT jint JNI_OnLoad(JavaVM*, void*){
            LOGI("libtool starting");
            installCrash();
            std::thread(gumThread).detach();
            return JNI_VERSION_1_6;
          }
          // settings persistence + dir used by crash handler
          void toolSetDir(const std::string& d){ g_dir=d; }
          EOF_MAIN

      - name: Generate native renderer.cpp (EGL + ImGui on app Surface)
        run: |
          [ -f native/renderer.cpp ] && exit 0
          cat > native/renderer.cpp <<'EOF_REND'
          #include "state.h"
          #include <imgui.h>
          #include <imgui_impl_opengl3.h>
          #include <android/native_window.h>
          #include <android/native_window_jni.h>
          #include <EGL/egl.h>
          #include <GLES3/gl3.h>
          #include <thread>
          #include <chrono>
          struct TouchEv { int a; float x,y; };
          static std::atomic<ANativeWindow*> g_win{nullptr};
          static std::atomic<int> g_w{0}, g_h{0};
          static std::atomic<float> g_density{2.0f};
          static std::atomic<bool> g_run{false}, g_capture{false}, g_wantText{false};
          static std::mutex g_evMtx; static std::vector<TouchEv> g_ev;
          static std::string g_text; static std::vector<int> g_special;
          static std::thread g_thr;
          static ImGuiContext* g_igui=nullptr;

          static void renderMain(){
            ANativeWindow* win=g_win.load();
            EGLDisplay dpy=eglGetDisplay(EGL_DEFAULT_DISPLAY);
            eglInitialize(dpy,nullptr,nullptr);
            const EGLint cfgAttr[]={EGL_SURFACE_TYPE,EGL_WINDOW_BIT,EGL_RENDERABLE_TYPE,EGL_OPENGL_ES3_BIT,
              EGL_RED_SIZE,8,EGL_GREEN_SIZE,8,EGL_BLUE_SIZE,8,EGL_ALPHA_SIZE,8,EGL_NONE};
            EGLConfig cfg; EGLint n=0;
            eglChooseConfig(dpy,cfgAttr,&cfg,1,&n);
            if(!n){ ANativeWindow_release(win); return; }
            EGLSurface surf=eglCreateWindowSurface(dpy,cfg,win,nullptr);
            const EGLint ctxAttr[]={EGL_CONTEXT_CLIENT_VERSION,3,EGL_NONE};
            eglBindAPI(EGL_OPENGL_ES_API);
            EGLContext ctx=eglCreateContext(dpy,cfg,EGL_NO_CONTEXT,ctxAttr);
            eglMakeCurrent(dpy,surf,surf,ctx);
            eglSwapInterval(dpy,1);
            if(!g_igui){ g_igui=ImGui::CreateContext(); }
            ImGui::SetCurrentContext(g_igui);
            ImGuiIO& io=ImGui::GetIO();
            float d=g_density.load();
            ImFontConfig fc; fc.OversampleH=2;
            if(io.Fonts->Fonts.empty())
              io.Fonts->AddFontFromFileTTF("/system/fonts/Roboto-Regular.ttf",16.0f*d,&fc);
            ImGui::StyleColorsDark();
            ImGui::GetStyle().ScaleAllSizes(d*0.9f);
            ImGui_ImplOpenGL3_Init("#version 300 es");
            auto last=std::chrono::steady_clock::now();
            while(g_run.load()){
              { std::lock_guard<std::mutex> lk(g_evMtx);
                for(auto& e:g_ev){
                  ImGui_ImplOpenGL3_NewFrame(); // no-op cost; keep io current below
                  io.AddMousePosEvent(e.x,e.y);
                  if(e.a==0) io.AddMouseButtonEvent(0,true);
                  else if(e.a==1||e.a==3) io.AddMouseButtonEvent(0,false);
                }
                g_ev.clear();
                if(!g_text.empty()){ io.AddInputCharactersUTF8(g_text.c_str()); g_text.clear(); }
                for(int k:g_special){ ImGuiKey key=k==1?ImGuiKey_Backspace:ImGuiKey_Enter;
                  io.AddKeyEvent(key,true); io.AddKeyEvent(key,false); }
                g_special.clear();
              }
              auto now=std::chrono::steady_clock::now();
              io.DeltaTime=std::chrono::duration<float>(now-last).count(); last=now;
              if(io.DeltaTime<=0) io.DeltaTime=0.016f;
              io.DisplaySize=ImVec2((float)g_w.load(),(float)g_h.load());
              ImGui_ImplOpenGL3_NewFrame();
              ImGui::NewFrame();
              ui::draw();
              g_capture.store(io.WantCaptureMouse);
              g_wantText.store(io.WantTextInput);
              ImGui::Render();
              glViewport(0,0,g_w.load(),g_h.load());
              glClearColor(0,0,0,0); glClear(GL_COLOR_BUFFER_BIT);
              ImGui_ImplOpenGL3_RenderDrawData(ImGui::GetDrawData());
              eglSwapBuffers(dpy,surf);
            }
            ImGui_ImplOpenGL3_Shutdown();
            eglMakeCurrent(dpy,EGL_NO_SURFACE,EGL_NO_SURFACE,EGL_NO_CONTEXT);
            eglDestroySurface(dpy,surf); eglDestroyContext(dpy,ctx); eglTerminate(dpy);
            ANativeWindow_release(win);
          }
          extern "C" __attribute__((visibility("default")))
          void tool_surface(void* win,int w,int h,float density){
            if(g_run.load()) return;
            g_win.store((ANativeWindow*)win); g_w.store(w); g_h.store(h); g_density.store(density);
            g_run.store(true); g_thr=std::thread(renderMain);
          }
          extern "C" __attribute__((visibility("default")))
          void tool_surface_resize(int w,int h){ g_w.store(w); g_h.store(h); }
          extern "C" __attribute__((visibility("default")))
          void tool_surface_destroy(){
            if(!g_run.load()) return;
            g_run.store(false); if(g_thr.joinable()) g_thr.join();
          }
          extern "C" __attribute__((visibility("default")))
          int tool_touch(int a,float x,float y){
            if(!g_run.load()) return 0;
            if(a==0||a==1||a==2||a==3){ std::lock_guard<std::mutex> lk(g_evMtx); g_ev.push_back({a,x,y}); }
            return (g_capture.load()?1:0)|(g_wantText.load()?2:0);
          }
          extern "C" __attribute__((visibility("default")))
          void tool_text(const char* s){ std::lock_guard<std::mutex> lk(g_evMtx); g_text+=s; }
          extern "C" __attribute__((visibility("default")))
          void tool_special(int k){ std::lock_guard<std::mutex> lk(g_evMtx); g_special.push_back(k); }
          EOF_REND

      - name: Generate native ui.cpp (all 9 tabs)
        run: |
          [ -f native/ui.cpp ] && exit 0
          cat > native/ui.cpp <<'EOF_UI'
          #include "state.h"
          #include <imgui.h>
          #include <imgui_stdlib.h>
          #include <algorithm>
          #include <fstream>
          void toolSetDir(const std::string&);
          static int req(){ return G.nextReq++; }
          static ImU32 typeCol(const std::string& t){
            if(t=="void") return IM_COL32(150,150,150,255);
            if(t=="boolean") return IM_COL32(255,120,180,255);
            if(t=="int"||t=="long"||t=="short"||t=="byte") return IM_COL32(110,180,255,255);
            if(t=="float"||t=="double") return IM_COL32(90,220,220,255);
            if(t=="char") return IM_COL32(120,220,160,255);
            if(t=="java.lang.String"||t=="java.lang.CharSequence") return IM_COL32(240,220,110,255);
            if(!t.empty()&&t.back()==']') return IM_COL32(200,150,255,255);
            return IM_COL32(255,170,90,255);
          }
          static std::string sigOf(const MethodInfo& m){
            std::string s=m.ret+" "+m.n+"("; for(size_t i=0;i<m.p.size();i++){ if(i)s+=", "; s+=m.p[i]; } return s+")";
          }
          static std::string hookTemplate(const MethodInfo& m){
            std::string s="// "+sigOf(m)+"\n// a[i] = arguments (typed), orig() = call original\n";
            for(size_t i=0;i<m.p.size();i++) s+="// a["+std::to_string(i)+"] : "+m.p[i]+"\n";
            s+="return orig();\n"; return s;
          }
          namespace ui {
          void toast(const std::string& s){ G.toasts.push_back({s,4.0f}); }
          void openClass(const std::string& cls,long long h){
            ClassWindow w; w.id=G.nextWin++; w.isList=false; w.cls=cls; w.handle=h;
            w.title=h?(cls+" @"+std::to_string(h)):cls;
            G.wins.push_back(w); G.activeWin=w.id;
            bridge::post({{"t","info"},{"id",req()},{"cls",cls},{"h",h},{"ctx",{{"w",w.id},{"k","info"}}}});
          }
          static ClassWindow* winById(int id){ for(auto& w:G.wins) if(w.id==id) return &w; return nullptr; }
          static ArgEditor* editorByCtx(ClassWindow& w,const json& c){
            std::string e=c.value("e",""), m=c.value("m","");
            if(e=="ctor") return &w.ctorArgs;
            if(w.mu.count(m)){ if(e=="call") return &w.mu[m].callArgs; if(e=="patch") return &w.mu[m].patchArgs; }
            return nullptr;
          }
          // ---------------- routing ----------------
          void route(const json& j){
            std::lock_guard<std::mutex> lk(G.mtx);
            std::string t=j.value("t","");
            if(t=="paths"){ G.cfg.dir=j.value("dir",""); G.cfg.pkg=j.value("pkg",""); G.cfg.sdk=j.value("sdk",0);
              toolSetDir(G.cfg.dir); snprintf(G.recScope,sizeof G.recScope,"%s",G.cfg.pkg.c_str());
              std::ifstream f(G.cfg.dir+"/settings.json");
              if(f){ try{ json s; f>>s; G.cfg.fontScale=s.value("fontScale",1.0f); G.cfg.opacity=s.value("opacity",0.95f);
                G.cfg.theme=s.value("theme",0); G.cfg.logCap=s.value("logCap",2000);
                G.cfg.publishDownloads=s.value("publishDownloads",true);}catch(...){} }
              return; }
            if(t=="ready"){ toast("agent ready"); return; }
            if(t=="toast"){ toast(j.value("msg","")); return; }
            if(t=="clip"){ ImGui::SetClipboardText(j.value("text","").c_str()); return; }
            if(t=="log"){
              std::string ch=j.value("ch","script"); LogEntry e;
              e.text=j.value("text",""); e.cls=j.value("cls",""); e.raw=j;
              if(j.contains("stack")) for(auto& f:j["stack"]) e.stack.push_back({f.value("c",""),f.value("s","")});
              auto cap=[&](std::deque<LogEntry>& d){ d.push_back(e); while((int)d.size()>G.cfg.logCap) d.pop_front(); };
              if(ch=="track"){ std::string id=j.value("id",""); if(G.tracks.count(id)){ auto& d=G.tracks[id].log;
                  d.push_back(e); while((int)d.size()>G.cfg.logCap) d.pop_front(); } }
              else if(ch=="record") cap(G.recordLog);
              else if(ch=="monitor") cap(G.monitorLog);
              else cap(G.scriptLog);
              return; }
            json c=j.value("ctx",json::object()); ClassWindow* wp=winById(c.value("w",-1));
            if(t=="callResult"&&wp){ std::string m=c.value("m",""); auto& mu=wp->mu[m];
              mu.callResult=(j.value("ok",false)?"= ":"ERROR: ")+j.value("text","");
              mu.callLog.push_back({mu.callResult,j.value("cls",""),{},{}}); return; }
            if(!wp) return;
            ClassWindow& w=*wp;
            if(t=="classes"){ w.results=j.value("items",std::vector<std::string>{}); w.searching=false; }
            else if(t=="info"){ w.loaded=true; w.methods.clear(); w.fields.clear();
              for(auto& m:j.value("methods",json::array())){ MethodInfo mi; mi.n=m.value("n",""); mi.mods=m.value("mods","");
                mi.ret=m.value("ret","void"); mi.st=m.value("st",false); mi.ov=m.value("ov",-1);
                mi.p=m.value("p",std::vector<std::string>{}); w.methods.push_back(mi); }
              for(auto& f:j.value("fields",json::array())){ FieldInfo fi; fi.n=f.value("n",""); fi.mods=f.value("mods","");
                fi.t=f.value("t",""); fi.st=f.value("st",false); fi.v=f.value("v",""); w.fields.push_back(fi); }
              w.ctors=j.value("ctors",json::array());
              if(!w.ctors.empty()){ std::vector<std::string> t0=w.ctors[0].get<std::vector<std::string>>();
                w.ctorArgs.init(t0,false); } }
            else if(t=="inst"){ std::string k=c.value("k","");
              std::vector<InstanceInfo> items;
              for(auto& i:j.value("items",json::array())) items.push_back({i.value("h",0LL),i.value("s","")});
              if(k=="find") w.instances=items;
              else if(k=="argfind"){ if(ArgEditor* e=editorByCtx(w,c)){ e->results=items; e->busy=false; } } }
            else if(t=="created"){ std::string k=c.value("k",""); long long h=j.value("h",0LL);
              if(k=="create") openClass(w.cls,h);
              else if(k=="argcreate"){ if(ArgEditor* e=editorByCtx(w,c)){ int i=c.value("i",0);
                if(i>=0&&i<(int)e->vals.size()){ e->vals[i]=json{{"k","obj"},{"h",h}}; e->popupFor=-1; e->busy=false; } } }
              else if(k=="ctorcreate") openClass(j.value("cls",w.cls),h); }
            else if(t=="fieldVal"){ std::string m=c.value("m",""); if(w.mu.count(m)) w.mu[m].fieldVal=j.value("val",""); }
          }
