name: stage2-fixes
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix IME text + first-show + recorder contention + neon toggle
        run: |
          python3 - <<'PY'
          import sys
          def rep(path,old,new):
              s=open(path,encoding='utf-8').read()
              if old in s:
                  open(path,'w',encoding='utf-8').write(s.replace(old,new,1)); print('patched',path)
              elif new in s:
                  print('already',path)
              else:
                  print('MISS',path,repr(old[:70])); sys.exit(1)

          # ---- overlay: proper Java String -> JS string ----
          rep('agent/overlay.js',
              "function sendText(s){ const p=Memory.allocUtf8String(s); natives().text(p); }",
              """function sendText(s){ const p=Memory.allocUtf8String(s); natives().text(p); }
          function jstrToJs(j){
            if(typeof j==='string') return j;
            try{
              const b=j.getBytes('UTF-8'); const n=b.length; const u=new Uint8Array(n);
              for(let i=0;i<n;i++){ let x=b[i]; if(x<0)x+=256; u[i]=x; }
              return new TextDecoder().decode(u);
            }catch(e){ return ''+j; }
          }""")
          rep('agent/overlay.js',"const s=''+ed.toString();","const s=jstrToJs(ed.toString());")

          # ---- overlay: force first composition ----
          rep('agent/overlay.js','overlayView=v;',
              """overlayView=v;
              try{
                v.setVisibility(Java.use('android.view.View').VISIBLE.value);
                v.bringToFront(); v.requestLayout(); v.invalidate();
                decor.requestLayout(); decor.invalidate();
                const Kick=Java.registerClass({name:'re.tool.Kick'+Date.now(),
                  implements:[Java.use('java.lang.Runnable')],
                  methods:{ run(){ try{ v.requestLayout(); v.invalidate(); decor.requestLayout(); decor.invalidate(); }catch(e){} } }});
                Java.use('android.os.Handler').$new(Java.use('android.os.Looper').getMainLooper())
                  .postDelayed(Kick.$new(),300);
              }catch(e){}""")

          # ---- core: lightweight record logging (no stack under JS lock) ----
          rep('agent/core.js',
          """function logCall(st,args,ret,phase){
            const ch = st.track ? 'track' : 'record';
            const id = st.track ? st.trackId : key(st.cls,st.name,st.ov);
            const a = args.map(safeStr).join(', ');
            const text = phase==='exit'
              ? st.cls+'.'+st.name+'('+a+') -> '+safeStr(ret)
              : st.cls+'.'+st.name+'('+a+')';
            send({t:'log', ch:ch, id:id, cls:st.cls, name:st.name, text:text, stack:stack()});
          }""",
          """function logCall(st,args,ret,phase){
            try{
              const ch = st.track ? 'track' : 'record';
              const id = st.track ? st.trackId : key(st.cls,st.name,st.ov);
              const a = args.map(safeStr).join(', ');
              const text = phase==='exit'
                ? st.cls+'.'+st.name+'('+a+') -> '+safeStr(ret)
                : st.cls+'.'+st.name+'('+a+')';
              const stk = (ch==='track') ? stack() : [];
              send({t:'log', ch:ch, id:id, cls:st.cls, name:st.name, text:text, stack:stk});
            }catch(e){}
          }""")
          rep('agent/core.js','if(tracing) logCall(st,a,null,'enter');',
              'if(st.track&&st.trackOn) logCall(st,a,null,'enter');')

          # ---- ui: cmath ----
          rep('native/ui.cpp','#include <fstream>','#include <fstream>\n#include <cmath>')

          # ---- ui: neon triangle toggle (draggable + pulsing) ----
          rep('native/ui.cpp',
          """ImGui::SetNextWindowPos(ImVec2(8,140),ImGuiCond_FirstUseEver);
            ImGui::PushStyleVar(ImGuiStyleVar_WindowPadding,ImVec2(6,6));
            ImGui::Begin("##toggle",nullptr,ImGuiWindowFlags_NoDecoration|ImGuiWindowFlags_AlwaysAutoResize|ImGuiWindowFlags_NoNav);
            if(ImGui::Button(G.menuOpen?"X":"TOOL")) G.menuOpen=!G.menuOpen;
            ImGui::End(); ImGui::PopStyleVar();""",
          """static ImVec2 tpos(12,160);
            ImGui::SetNextWindowPos(tpos,ImGuiCond_Always);
            ImGui::SetNextWindowBgAlpha(0.0f);
            ImGui::PushStyleVar(ImGuiStyleVar_WindowPadding,ImVec2(0,0));
            ImGui::Begin("##toggle",nullptr,ImGuiWindowFlags_NoDecoration|ImGuiWindowFlags_AlwaysAutoResize|ImGuiWindowFlags_NoNav);
            ImVec2 sz(72,72);
            ImGui::InvisibleButton("##tgl",sz);
            static bool dragging=false; static float moved=0;
            if(ImGui::IsItemActivated()){ dragging=true; moved=0; }
            if(dragging&&ImGui::IsMouseDown(0)){ ImVec2 d=io.MouseDelta; moved+=fabsf(d.x)+fabsf(d.y); tpos.x+=d.x; tpos.y+=d.y; }
            if(dragging&&ImGui::IsMouseReleased(0)){ dragging=false; if(moved<6.0f) G.menuOpen=!G.menuOpen; }
            ImDrawList* dl=ImGui::GetWindowDrawList();
            ImVec2 p=ImGui::GetItemRectMin();
            ImVec2 c(p.x+sz.x*0.5f,p.y+sz.y*0.5f);
            float t=(float)ImGui::GetTime();
            float pulse=0.5f+0.5f*sinf(t*2.5f);
            float r=30.0f;
            ImVec2 a(c.x,c.y-r), b(c.x-r*0.87f,c.y+r*0.5f), cc(c.x+r*0.87f,c.y+r*0.5f);
            dl->AddTriangle(a,b,cc,IM_COL32(0,255,150,(int)(70+120*pulse)),3.0f+2.0f*pulse);
            dl->AddTriangle(a,b,cc,IM_COL32(0,168,107,255),1.5f);
            float br=14.0f+2.0f*pulse;
            dl->AddCircleFilled(c,br+4.0f,IM_COL32(200,80,255,(int)(90+150*pulse)),32);
            dl->AddCircleFilled(c,br,IM_COL32(160,32,240,255),32);
            dl->AddCircle(c,br,IM_COL32(255,255,255,200),32,1.5f);
            dl->AddText(ImVec2(c.x-5,c.y-7),IM_COL32(255,255,255,255),"T");
            ImGui::End(); ImGui::PopStyleVar();""")

          # ---- ui: capped log list + stack popup (no per-frame stack rendering) ----
          rep('native/ui.cpp',
          """static void drawLog(std::deque<LogEntry>& log,bool openCls){
            ImGui::BeginChild("##log",ImVec2(-1,220),true);
            for(auto& e:log){
              if(openCls&&!e.cls.empty()){ if(ImGui::Selectable(e.text.c_str())) openClass(e.cls); }
              else ImGui::TextWrapped("%s",e.text.c_str());
              drawStack(e.stack);
            }
            if(ImGui::GetScrollY()>=ImGui::GetScrollMaxY()-4) ImGui::SetScrollHereY(1.0f);
            ImGui::EndChild();
          }""",
          """static LogEntry g_detail; static bool g_detailOpen=false;
          static void drawLog(std::deque<LogEntry>& log,bool openCls){
            ImGui::BeginChild("##log",ImVec2(-1,220),true);
            int n=(int)log.size(); int start=std::max(0,n-150);
            for(int i=start;i<n;i++){
              auto& e=log[i];
              ImGui::PushID(i);
              if(ImGui::Selectable(e.text.c_str())){
                if(openCls&&!e.cls.empty()) openClass(e.cls);
                else if(!e.stack.empty()){ g_detail=e; g_detailOpen=true; }
              }
              ImGui::PopID();
            }
            if(ImGui::GetScrollY()>=ImGui::GetScrollMaxY()-4) ImGui::SetScrollHereY(1.0f);
            ImGui::EndChild();
          }""")
          rep('native/ui.cpp','float y=io.DisplaySize.y-30;',
          """if(g_detailOpen){ ImGui::OpenPopup("Call stack"); g_detailOpen=false; }
            if(ImGui::BeginPopupModal("Call stack",nullptr,ImGuiWindowFlags_AlwaysAutoResize)){
              for(auto& f:g_detail.stack){ if(ImGui::Selectable(f.s.c_str())){ openClass(f.c); ImGui::CloseCurrentPopup(); } }
              if(ImGui::Button("Close")) ImGui::CloseCurrentPopup();
              ImGui::EndPopup();
            }
            float y=io.DisplaySize.y-30;""")
          print('PATCHES OK')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent native
          git diff --cached --quiet || { git commit -m "stage2: IME text fix, first-show kick, recorder contention fix, neon toggle [skip ci]"; git push; }

      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: nttld/setup-ndk@v1
        id: ndk
        with: { ndk-version: r26d }

      - name: Bundle agent + verify
        run: |
          npm init -y >/dev/null
          node -e "const p=require('./package.json');p.type='module';require('fs').writeFileSync('package.json',JSON.stringify(p,null,2))"
          npm install --no-fund --no-audit frida-compile@^16 frida-java-bridge@^6 esbuild buffer@^6
          mkdir -p build/generated
          verify(){ node --check build/agent.js && node -e "const s=require('fs').readFileSync('build/agent.js','utf8'); if(s.length<50000){console.error('too small '+s.length);process.exit(1)} if(/^\s*(import|export)[ {]/m.test(s)||/^\s*const .*=\s*require\(/m.test(s)||/^\s*require\(/m.test(s)){console.error('unbundled statements remain');process.exit(1)} if(!s.includes('Buffer')){console.error('Buffer missing');process.exit(1)} console.log('bundle verified bytes='+s.length);"; }
          npx frida-compile agent/index.js -o build/agent.js 2>build/fc.log || true
          if ! verify; then
            echo "frida-compile invalid/failed:"; tail -20 build/fc.log || true
            npx esbuild agent/index.js --bundle --format=iife --target=es2020 --platform=browser --define:global=globalThis --outfile=build/agent.js
            verify || { echo "BUNDLE FAILED"; head -c 400 build/agent.js; exit 1; }
          fi
          (cd build && xxd -i agent.js > generated/agent_js.h)

      - name: Fetch devkits / imgui / json
        run: |
          mkdir -p deps
          V="${FRIDA_VERSION:-16.7.19}"
          for ABI in arm64 arm; do
            URL="https://github.com/frida/frida/releases/download/$V/frida-gumjs-devkit-$V-android-$ABI.tar.xz"
            if ! curl -fL -o devkit-$ABI.tar.xz "$URL"; then
              V=$(curl -fsSL "https://api.github.com/repos/frida/frida/releases?per_page=100" | jq -r '[.[].tag_name | select(startswith("16."))][0]')
              URL="https://github.com/frida/frida/releases/download/$V/frida-gumjs-devkit-$V-android-$ABI.tar.xz"
              curl -fL -o devkit-$ABI.tar.xz "$URL"
            fi
            mkdir -p deps/gum-$ABI; tar -xf devkit-$ABI.tar.xz -C deps/gum-$ABI
          done
          git clone --depth 1 --branch v1.90.9 https://github.com/ocornut/imgui deps/imgui
          mkdir -p deps/json/nlohmann
          curl -fL -o deps/json/nlohmann/json.hpp https://github.com/nlohmann/json/releases/download/v3.11.3/json.hpp

      - name: Build libtool.so
        run: |
          NDK="${{ steps.ndk.outputs.ndk-path }}"
          for PAIR in "arm64-v8a:arm64" "armeabi-v7a:arm"; do
            AABI="${PAIR%%:*}"; GABI="${PAIR##*:}"
            cmake -S . -B build/$AABI -Wno-deprecated \
              -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$AABI -DANDROID_PLATFORM=android-26 \
              -DCMAKE_BUILD_TYPE=Release \
              -DGUM_DIR=$GITHUB_WORKSPACE/deps/gum-$GABI \
              -DIMGUI_DIR=$GITHUB_WORKSPACE/deps/imgui \
              -DJSON_DIR=$GITHUB_WORKSPACE/deps/json \
              -DGEN_DIR=$GITHUB_WORKSPACE/build/generated
            cmake --build build/$AABI -j$(nproc)
          done
          mkdir -p out
          cp build/arm64-v8a/libtool.so out/libtool-arm64-v8a.so
          cp build/armeabi-v7a/libtool.so out/libtool-armeabi-v7a.so

      - name: Build test APK
        run: |
          set -e
          pick_bt(){ for v in 36.0.0 35.0.0 34.0.0; do [ -d "$ANDROID_HOME/build-tools/$v" ] && { echo "$ANDROID_HOME/build-tools/$v"; return; }; done; ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null | sort -V | tail -1; }
          pick_pj(){ for v in 34 35 36; do [ -f "$ANDROID_HOME/platforms/android-$v/android.jar" ] && { echo "$ANDROID_HOME/platforms/android-$v/android.jar"; return; }; done; ls -d "$ANDROID_HOME"/platforms/android-*/android.jar 2>/dev/null | sort -V | tail -1; }
          BT=$(pick_bt); PJ=$(pick_pj); BT="${BT%/}"; echo "BT=$BT PJ=$PJ"
          mkdir -p build/apk/obj build/apk/lib/arm64-v8a build/apk/lib/armeabi-v7a
          "$BT/aapt2" link --manifest testapp/AndroidManifest.xml -I "$PJ" \
            --min-sdk-version 26 --target-sdk-version 34 -o build/apk/base.apk
          javac -g -nowarn -source 8 -target 8 -bootclasspath "$PJ" -d build/apk/obj \
            testapp/src/com/example/tooltest/MainActivity.java
          "$BT/d8" --release --min-api 26 --lib "$PJ" --output build/apk $(find build/apk/obj -name '*.class')
          (cd build/apk && zip -j base.apk classes.dex)
          cp out/libtool-arm64-v8a.so build/apk/lib/arm64-v8a/libtool.so
          cp out/libtool-armeabi-v7a.so build/apk/lib/armeabi-v7a/libtool.so
          (cd build/apk && zip -r base.apk lib)
          "$BT/zipalign" -f 4 build/apk/base.apk build/apk/aligned.apk
          keytool -genkeypair -keystore build/debug.keystore -alias k -keyalg RSA \
            -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=tool"
          "$BT/apksigner" sign --ks build/debug.keystore --ks-pass pass:android \
            --key-pass pass:android --out out/tooltest.apk build/apk/aligned.apk

      - name: Upload clean artifact (3 files only)
        uses: actions/upload-artifact@v4
        with:
          name: libtool-stage2
          path: |
            out/tooltest.apk
            out/libtool-arm64-v8a.so
            out/libtool-armeabi-v7a.so
          if-no-files-found: error
