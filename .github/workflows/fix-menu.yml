name: stage0b-native-window
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move ANativeWindow acquisition into native
        run: |
          python3 - <<'PY'
          import sys
          def rep(path,old,new):
              s=open(path,encoding='utf-8').read()
              if old in s:
                  open(path,'w',encoding='utf-8').write(s.replace(old,new,1)); print('patched',path)
              elif new in s:
                  print('already',path)
              else:
                  print('MISS',path,repr(old[:70])); sys.exit(1)

          rep('native/diag.h','void init(JavaVM* vm);','void init(JavaVM* vm);\n  JavaVM* vm();')
          rep('native/diag.cpp','std::string dir(){ return g_dir; }',
              'std::string dir(){ return g_dir; }\nJavaVM* vm(){ return g_vm; }')
          rep('native/exports.map','tool_surface;','tool_surface; tool_surface_from_java;')

          newfn='''extern "C" __attribute__((visibility("default")))
          void tool_surface_from_java(void* surface,int w,int h,float density){
            diag::log("tool_surface_from_java surface=%p %dx%d d=%.2f",surface,w,h,density);
            JavaVM* vm=diag::vm();
            if(!vm){ diag::log("FAIL no JavaVM"); return; }
            JNIEnv* env=nullptr;
            if(vm->GetEnv((void**)&env,JNI_VERSION_1_6)!=0||!env){ diag::log("FAIL GetEnv"); return; }
            ANativeWindow* win=ANativeWindow_fromSurface(env,(jobject)surface);
            if(!win){ diag::log("FAIL ANativeWindow_fromSurface null"); return; }
            diag::log("ANativeWindow=%p",win);
            tool_surface(win,w,h,density);
          }
          '''
          rep('native/renderer.cpp',
              'extern "C" __attribute__((visibility("default")))\nvoid tool_surface_resize(int w,int h){',
              newfn+'extern "C" __attribute__((visibility("default")))\nvoid tool_surface_resize(int w,int h){')

          # smoke agent: use native helper + granular probes
          rep('agent/index.js',
              "surface:new NativeFunction(g('tool_surface'),'void',['pointer','int','int','float']),",
              "surface:new NativeFunction(g('tool_surface'),'void',['pointer','int','int','float']),\n              surfaceJava:new NativeFunction(g('tool_surface_from_java'),'void',['pointer','int','int','float']),")
          old="""surfaceCreated(h){ try{
                      const win=N.aw(env,h.getSurface().$h);
                      const r=h.getSurfaceFrame();
                      D('PASS surfaceCreated '+r.width()+'x'+r.height());
                      N.surface(win,r.width(),r.height(),density);
                      D('PASS tool_surface called');
                    }catch(e){ D('FAIL surfaceCreated '+e); } },"""
          new="""surfaceCreated(h){ try{
                      D('sc: getSurface');
                      const s=h.getSurface();
                      if(s.$h===undefined||s.$h===null){ D('FAIL surface handle missing'); return; }
                      D('sc: surface handle='+s.$h);
                      const r=h.getSurfaceFrame();
                      D('sc: frame '+r.width()+'x'+r.height());
                      N.surfaceJava(s.$h,r.width(),r.height(),density);
                      D('PASS tool_surface called');
                    }catch(e){ D('FAIL surfaceCreated '+e); } },"""
          rep('agent/index.js',old,new)
          print('PATCHES OK')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native agent
          git diff --cached --quiet || { git commit -m "stage0b: acquire ANativeWindow in native via stored JavaVM [skip ci]"; git push; }

      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: nttld/setup-ndk@v1
        id: ndk
        with: { ndk-version: r26d }

      - name: Bundle smoke agent + verify
        run: |
          npm init -y >/dev/null
          node -e "const p=require('./package.json');p.type='module';require('fs').writeFileSync('package.json',JSON.stringify(p,null,2))"
          npm install --no-fund --no-audit frida-compile@^16 frida-java-bridge@^6 esbuild buffer@^6
          mkdir -p build/generated
          verify(){ node --check build/agent.js && node -e "const s=require('fs').readFileSync('build/agent.js','utf8'); if(s.length<50000){console.error('too small '+s.length);process.exit(1)} if(/^\s*(import|export)[ {]/m.test(s)||/^\s*const .*=\s*require\(/m.test(s)||/^\s*require\(/m.test(s)){console.error('unbundled statements remain');process.exit(1)} if(!s.includes('Buffer')||!s.includes('SMOKE')){console.error('marker missing');process.exit(1)} console.log('bundle verified bytes='+s.length);"; }
          npx frida-compile agent/index.js -o build/agent.js 2>build/fc.log || true
          if ! verify; then
            echo "frida-compile invalid/failed:"; tail -20 build/fc.log || true
            npx esbuild agent/index.js --bundle --format=iife --target=es2020 --platform=browser --define:global=globalThis --outfile=build/agent.js
            verify || { echo "BUNDLE FAILED"; head -c 400 build/agent.js; exit 1; }
          fi
          echo "--- agent head ---"; head -c 120 build/agent.js; echo
          (cd build && xxd -i agent.js > generated/agent_js.h)

      - name: Fetch devkits / imgui / json
        run: |
          mkdir -p deps
          V="${FRIDA_VERSION:-16.7.19}"
          for ABI in arm64 arm; do
            URL="https://github.com/frida/frida/releases/download/$V/frida-gumjs-devkit-$V-android-$ABI.tar.xz"
            if ! curl -fL -o devkit-$ABI.tar.xz "$URL"; then
              V=$(curl -fsSL "https://api.github.com/repos/frida/frida/releases?per_page=100" | jq -r '[.[].tag_name | select(startswith("16."))][0]')
              URL="https://github.com/frida/frida/releases/download/$V/frida-gumjs-devkit-$V-android-$ABI.tar.xz"
              curl -fL -o devkit-$ABI.tar.xz "$URL"
            fi
            mkdir -p deps/gum-$ABI; tar -xf devkit-$ABI.tar.xz -C deps/gum-$ABI
          done
          git clone --depth 1 --branch v1.90.9 https://github.com/ocornut/imgui deps/imgui
          mkdir -p deps/json/nlohmann
          curl -fL -o deps/json/nlohmann/json.hpp https://github.com/nlohmann/json/releases/download/v3.11.3/json.hpp

      - name: Build libtool.so
        run: |
          NDK="${{ steps.ndk.outputs.ndk-path }}"
          for PAIR in "arm64-v8a:arm64" "armeabi-v7a:arm"; do
            AABI="${PAIR%%:*}"; GABI="${PAIR##*:}"
            cmake -S . -B build/$AABI -Wno-deprecated \
              -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$AABI -DANDROID_PLATFORM=android-26 \
              -DCMAKE_BUILD_TYPE=Release \
              -DGUM_DIR=$GITHUB_WORKSPACE/deps/gum-$GABI \
              -DIMGUI_DIR=$GITHUB_WORKSPACE/deps/imgui \
              -DJSON_DIR=$GITHUB_WORKSPACE/deps/json \
              -DGEN_DIR=$GITHUB_WORKSPACE/build/generated
            cmake --build build/$AABI -j$(nproc)
          done
          mkdir -p out
          cp build/arm64-v8a/libtool.so out/libtool-arm64-v8a.so
          cp build/armeabi-v7a/libtool.so out/libtool-armeabi-v7a.so

      - name: Build test APK
        run: |
          set -e
          pick_bt(){ for v in 36.0.0 35.0.0 34.0.0; do [ -d "$ANDROID_HOME/build-tools/$v" ] && { echo "$ANDROID_HOME/build-tools/$v"; return; }; done; ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null | sort -V | tail -1; }
          pick_pj(){ for v in 34 35 36; do [ -f "$ANDROID_HOME/platforms/android-$v/android.jar" ] && { echo "$ANDROID_HOME/platforms/android-$v/android.jar"; return; }; done; ls -d "$ANDROID_HOME"/platforms/android-*/android.jar 2>/dev/null | sort -V | tail -1; }
          BT=$(pick_bt); PJ=$(pick_pj); BT="${BT%/}"; echo "BT=$BT PJ=$PJ"
          mkdir -p build/apk/obj build/apk/lib/arm64-v8a build/apk/lib/armeabi-v7a
          "$BT/aapt2" link --manifest testapp/AndroidManifest.xml -I "$PJ" \
            --min-sdk-version 26 --target-sdk-version 34 -o build/apk/base.apk
          javac -g -nowarn -source 8 -target 8 -bootclasspath "$PJ" -d build/apk/obj \
            testapp/src/com/example/tooltest/MainActivity.java
          "$BT/d8" --release --min-api 26 --lib "$PJ" --output build/apk $(find build/apk/obj -name '*.class')
          (cd build/apk && zip -j base.apk classes.dex)
          cp out/libtool-arm64-v8a.so build/apk/lib/arm64-v8a/libtool.so
          cp out/libtool-armeabi-v7a.so build/apk/lib/armeabi-v7a/libtool.so
          (cd build/apk && zip -r base.apk lib)
          "$BT/zipalign" -f 4 build/apk/base.apk build/apk/aligned.apk
          keytool -genkeypair -keystore build/debug.keystore -alias k -keyalg RSA \
            -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=tool"
          "$BT/apksigner" sign --ks build/debug.keystore --ks-pass pass:android \
            --key-pass pass:android --out out/tooltest.apk build/apk/aligned.apk

      - name: Upload clean artifact (3 files only)
        uses: actions/upload-artifact@v4
        with:
          name: libtool-stage0b
          path: |
            out/tooltest.apk
            out/libtool-arm64-v8a.so
            out/libtool-armeabi-v7a.so
          if-no-files-found: error
