name: patch-fix-menu-workflow
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix indentation in fix-menu.yml reps
        run: |
          python3 - <<'PY'
          p='.github/workflows/fix-menu.yml'
          s=open(p,encoding='utf-8').read()
          before=s
          # renderer tool_surface rep: body indent is 2 spaces, not 4
          s=s.replace('\\n    if(g_run.load()) return;','\\n  if(g_run.load()) return;')
          s=s.replace('\\n    diag::log("tool_surface','\\n  diag::log("tool_surface')
          # diag.cpp resolver line: 2 spaces, not 4
          s=s.replace("'    if(resolver) env->DeleteLocalRef(resolver);'",
                      "'  if(resolver) env->DeleteLocalRef(resolver);'")
          open(p,'w',encoding='utf-8').write(s)
          print('changed' if s!=before else 'nothing changed (already fixed?)')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "fix rep indentation in fix-menu workflow [skip ci]"; git push; }
